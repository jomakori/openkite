name: Rust setup
description: Install the stable toolchain, native GTK/WebKit deps, and the cargo cache.

inputs:
  extra-components:
    description: Space-separated rustup components to add (e.g. "rustfmt clippy")
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: ${{ inputs.extra-components }}
    - name: Install system dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libwebkit2gtk-4.1-dev libgtk-3-dev libglib2.0-dev \
          libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
    - uses: Swatinem/rust-cache@v2
