name: Rust setup
description: Install the Rust toolchain, the native packages a job needs, and the cargo cache.

inputs:
  extra-components:
    description: Comma-separated rustup components to add (e.g. "rustfmt,clippy").
    required: false
    default: ''
  targets:
    description: Comma-separated compilation targets to add to the toolchain.
    required: false
    default: ''
  profile:
    description: Native package set on Linux — "desktop" installs the WebKitGTK/GTK stack, "none" installs nothing.
    required: false
    default: desktop
  apt-extra:
    description: Extra apt packages this job needs (e.g. "xvfb xdotool imagemagick dbus-x11 openbox bats").
    required: false
    default: ''
  cache-key:
    description: Extra rust-cache key, so matrix jobs do not share one cache bucket.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: ${{ inputs.extra-components }}
        targets: ${{ inputs.targets }}
    - name: Install native packages
      if: runner.os == 'Linux'
      shell: bash
      env:
        PROFILE: ${{ inputs.profile }}
        APT_EXTRA: ${{ inputs.apt-extra }}
      run: |
        set -euo pipefail
        packages=()
        if [ "$PROFILE" = "desktop" ]; then
          packages+=(
            libwebkit2gtk-4.1-dev libgtk-3-dev libglib2.0-dev
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
          )
        fi
        if [ -n "$APT_EXTRA" ]; then
          read -r -a extra <<<"$APT_EXTRA"
          packages+=("${extra[@]}")
        fi
        if [ "${#packages[@]}" -eq 0 ]; then
          echo "no native packages requested"
          exit 0
        fi
        # Skip packages the runner image already ships (e.g. xvfb,
        # libssl-dev on ubuntu-24.04) so apt only ever fetches what is
        # genuinely missing instead of re-resolving/re-downloading a set
        # that is half already installed.
        missing=()
        for pkg in "${packages[@]}"; do
          dpkg -s "$pkg" >/dev/null 2>&1 || missing+=("$pkg")
        done
        if [ "${#missing[@]}" -eq 0 ]; then
          echo "all requested native packages already present: ${packages[*]}"
          exit 0
        fi
        echo "installing missing native packages: ${missing[*]}"
        # Fail fast on a stalled mirror instead of hanging until the job
        # timeout, and skip apt's Recommends: they are the bulk of the
        # webkit/gtk install time and nothing here needs them.
        # DEBIAN_FRONTEND/NEEDRESTART_MODE stop dpkg postinst hooks
        # (needrestart) from blocking on a tty prompt.
        apt_opts=(-o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=3)
        timeout 300 sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a \
          apt-get "${apt_opts[@]}" update
        timeout 900 sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a \
          apt-get "${apt_opts[@]}" install -y --no-install-recommends -- "${missing[@]}"
    - uses: Swatinem/rust-cache@v2
      with:
        key: ${{ inputs.cache-key }}
