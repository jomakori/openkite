name: Build and publish an image
description: Build the console bundle into a container image and publish it to GHCR under the given tag.

inputs:
  ref:
    description: Git ref to build. Empty builds the triggering commit.
    required: false
    default: ''
  tag:
    description: Image tag to publish, without the registry prefix — pr-<N> for a preview, v<X.Y.Z> for a release.
    required: true
  pin-sha-tag:
    description: Also publish <tag>-<short sha> as an immutable pin that traces the image back to its commit.
    required: false
    default: 'false'
  host:
    description: Host that serves this image, for the run summary only.
    required: false
    default: ''
  platforms:
    description: Platforms to publish, in buildx's list form. The cluster runs arm64, so an
      amd64-only index is unpullable there.
    required: false
    default: 'linux/amd64,linux/arm64'

outputs:
  digest:
    description: Digest of the published image.
    value: ${{ steps.build.outputs.digest }}

runs:
  using: composite
  steps:
    - name: Check out the repository
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '26'
        cache: npm
        cache-dependency-path: web/package-lock.json

    - name: Build the console bundle
      shell: bash
      run: |
        set -euo pipefail
        if [ ! -x web/build.sh ]; then
          echo "::error title=No bundle script::web/build.sh is missing or not executable, so no image is published."
          exit 1
        fi
        ./web/build.sh
        if [ ! -f web/dist/index.html ]; then
          echo "::error title=Web build produced no bundle::web/build.sh ran but web/dist/index.html is missing."
          exit 1
        fi

    - name: Validate the image tag
      shell: bash
      env:
        TAG: ${{ inputs.tag }}
      run: |
        set -euo pipefail
        if ! [[ "$TAG" =~ ^[A-Za-z0-9._-]+$ ]]; then
          echo "::error title=Unusable image tag::'${TAG}' is not a legal Docker tag."
          exit 1
        fi

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to the container registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Derive the image tags
      id: tags
      shell: bash
      env:
        TAG: ${{ inputs.tag }}
        PIN_SHA_TAG: ${{ inputs.pin-sha-tag }}
      run: |
        set -euo pipefail
        {
          echo "tags<<TAGS"
          echo "ghcr.io/jomakori/openkite:${TAG}"
          if [ "$PIN_SHA_TAG" = "true" ]; then
            echo "ghcr.io/jomakori/openkite:${TAG}-$(git rev-parse --short=7 HEAD)"
          fi
          echo "TAGS"
        } >> "$GITHUB_OUTPUT"

    - name: Build and push the image
      id: build
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        platforms: ${{ inputs.platforms }}
        tags: ${{ steps.tags.outputs.tags }}

    - name: Record the published references
      shell: bash
      env:
        HOST: ${{ inputs.host }}
        TAG: ${{ inputs.tag }}
        PIN_SHA_TAG: ${{ inputs.pin-sha-tag }}
        DIGEST: ${{ steps.build.outputs.digest }}
      run: |
        set -euo pipefail
        {
          echo "### Image published"
          echo ""
          echo "| item | reference |"
          echo "|---|---|"
          echo "| image | \`ghcr.io/jomakori/openkite:${TAG}\` |"
          echo "| digest | \`${DIGEST}\` |"
          if [ "$PIN_SHA_TAG" = "true" ]; then
            echo "| pinned to this commit | \`ghcr.io/jomakori/openkite:$(git rev-parse --short=7 HEAD)\` |"
          fi
          if [ -n "$HOST" ]; then
            echo "| served at | \`https://${HOST}\` |"
          fi
        } >> "$GITHUB_STEP_SUMMARY"
