name: Build and publish an image

description: |
  Build the browser host crate (`openkite-web`) plus its wasm hydration
  bundle into a single container image and publish it to GHCR under the
  given tag. The image server-renders the shared console from the crate
  on `:8080`; the React bundle path it used to mount is gone.

inputs:
  ref:
    description: Git ref to build. Empty builds the triggering commit.
    required: false
    default: ''
  tag:
    description: Image tag to publish, without the registry prefix — pr-<N> for a preview, v<X.Y.Z> for a release.
    required: true
  pin-sha-tag:
    description: Also publish <tag>-<short sha> as an immutable pin that traces the image back to its commit.
    required: false
    default: 'false'
  host:
    description: Host that serves this image, for the run summary only.
    required: false
    default: ''
  platforms:
    description: Platforms to publish, in buildx's list form. The cluster is arm64 only, so an
      amd64 leg is content nothing pulls and a QEMU-emulated build on every release. No QEMU is
      registered, so a platform other than the runner's own fails the build rather than
      running emulated.
    required: false
    default: 'linux/arm64'

outputs:
  digest:
    description: Digest of the published image.
    value: ${{ steps.build.outputs.digest }}

runs:
  using: composite
  steps:
    - name: Check out the repository
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}

    - name: Validate the image tag
      shell: bash
      env:
        TAG: ${{ inputs.tag }}
      run: |
        set -euo pipefail
        if ! [[ "$TAG" =~ ^[A-Za-z0-9._-]+$ ]]; then
          echo "::error title=Unusable image tag::'${TAG}' is not a legal Docker tag."
          exit 1
        fi

    # No QEMU: every caller runs on ubuntu-24.04-arm and never overrides
    # `platforms`, so the one platform built is the runner's own. Registering
    # binfmt for a build that never crosses architecture cost a step on every
    # preview and release image. A foreign platform now fails loudly instead.
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to the container registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Derive the image tags
      id: tags
      shell: bash
      env:
        TAG: ${{ inputs.tag }}
        PIN_SHA_TAG: ${{ inputs.pin-sha-tag }}
      run: |
        set -euo pipefail
        {
          echo "tags<<TAGS"
          echo "ghcr.io/jomakori/openkite:${TAG}"
          if [ "$PIN_SHA_TAG" = "true" ]; then
            echo "ghcr.io/jomakori/openkite:${TAG}-$(git rev-parse --short=7 HEAD)"
          fi
          echo "TAGS"
        } >> "$GITHUB_OUTPUT"

    - name: Build and push the image
      id: build
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        platforms: ${{ inputs.platforms }}
        tags: ${{ steps.tags.outputs.tags }}
        # Reuse the layers a previous run published. The dependency compile
        # in the Dockerfile is keyed on the manifests, so a warm cache turns
        # a release image from tens of minutes into a few.
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Record the published references
      shell: bash
      env:
        HOST: ${{ inputs.host }}
        TAG: ${{ inputs.tag }}
        PIN_SHA_TAG: ${{ inputs.pin-sha-tag }}
        DIGEST: ${{ steps.build.outputs.digest }}
      run: |
        set -euo pipefail
        {
          echo "### Image published"
          echo ""
          echo "| item | reference |"
          echo "|---|---|"
          echo "| image | \`ghcr.io/jomakori/openkite:${TAG}\` |"
          echo "| digest | \`${DIGEST}\` |"
          if [ "$PIN_SHA_TAG" = "true" ]; then
            echo "| pinned to this commit | \`ghcr.io/jomakori/openkite:$(git rev-parse --short=7 HEAD)\` |"
          fi
          if [ -n "$HOST" ]; then
            echo "| served at | \`https://${HOST}\` |"
          fi
        } >> "$GITHUB_STEP_SUMMARY"
