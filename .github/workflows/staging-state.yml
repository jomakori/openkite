name: Staging state

# The staging host must never have two claimants. The GitOps ApplicationSet
# watches the `staging` label directly, and it renders the splash placeholder
# only while the marker directory below exists — so this workflow, the only
# writer of that marker, decides which of the two answers staging-openkite.
#
# The marker lives on its own branch because main is protected, and the schedule
# converges it within ten minutes of a label event that could not push.

on:
  pull_request:
    types: [labeled, unlabeled, closed, reopened]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-state
  cancel-in-progress: true

jobs:
  publish:
    name: PUBLISH the staging marker
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    env:
      STATE_BRANCH: staging-state
      # A visible path on purpose: the ApplicationSet git generator does not see
      # dot-prefixed directories.
      MARKER_DIR: idle
      MARKER_FILE: idle/state
      STAGING_LABEL: staging
    steps:
      - name: CHECK OUT the repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: SWITCH to the state branch
        run: |
          set -euo pipefail
          if git fetch --depth 1 origin "$STATE_BRANCH"; then
            git checkout -B "$STATE_BRANCH" FETCH_HEAD
          else
            git checkout --orphan "$STATE_BRANCH"
            git rm -r --cached . >/dev/null
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          fi
      - name: RECOMPUTE the marker from the labeled pull requests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          staged="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --label "$STAGING_LABEL" --limit 1 --json number --jq '.[0].number // ""')"
          if [ -n "$staged" ]; then
            echo "pr-$staged carries $STAGING_LABEL: the placeholder stays off."
            rm -rf "$MARKER_DIR"
          else
            echo "no open pull request carries $STAGING_LABEL: the placeholder goes on."
            mkdir -p "$MARKER_DIR"
            {
              echo "# No open pull request carries the $STAGING_LABEL label, so the placeholder owns the staging host."
              echo "# CI maintains this file -- see .github/workflows/staging-state.yml."
            } >"$MARKER_FILE"
          fi
          git add -A
      - name: PUBLISH the marker when it changed
        run: |
          set -euo pipefail
          if git diff --cached --quiet; then
            echo "the marker already matches the label state."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "chore(staging-state): sync the placeholder marker [skip ci]"
          git push origin "$STATE_BRANCH"
