name: e2e

on:
  pull_request:
    paths:
      - 'e2e/**'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  push:
    branches: [main]
    paths:
      - 'e2e/**'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop-e2e:
    name: Desktop E2E (Xvfb + xdotool)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install system deps (GTK/WebKit for the desktop build, X11 automation for driving it)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libglib2.0-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev \
            xvfb xdotool imagemagick dbus-x11 openbox

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Build desktop binary
        run: cargo build --workspace

      - name: Run desktop E2E under Xvfb
        working-directory: e2e
        run: |
          mkdir -p artifacts
          ./run-desktop-e2e.sh ../target/debug/openkite artifacts || true
          ./debug-input.sh ../target/debug/openkite artifacts || true

      - name: Upload E2E artifacts (screenshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-e2e-artifacts
          path: e2e/artifacts/
          retention-days: 7
