name: e2e

on:
  pull_request:
    paths:
      - 'e2e/**'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'web/**'
      - 'assets/**'
  push:
    branches: [main]
    paths:
      - 'e2e/**'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'web/**'
      - 'assets/**'
  workflow_dispatch:
    inputs:
      capture_baselines:
        description: 'Capture baselines (upload as artifact for commit)'
        required: false
        default: 'false'
        type: boolean
      capture_parity_baselines:
        description: 'Capture console-parity baselines (browser render, upload as artifact for commit)'
        required: false
        default: 'false'
        type: boolean

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop-e2e:
    name: Desktop E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install system deps (GTK/WebKit for the desktop build, X11 automation for driving it)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libglib2.0-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev \
            xvfb xdotool imagemagick dbus-x11 openbox

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Build desktop binary
        run: cargo build --workspace

      - name: Run desktop E2E under Xvfb
        working-directory: e2e
        run: |
          mkdir -p artifacts
          ./run-desktop-e2e.sh ../target/debug/openkite artifacts

      - name: Upload E2E artifacts (screenshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-e2e-artifacts
          path: e2e/artifacts/
          retention-days: 7

  # Ten user-flow scenarios (OKT-61), each booting the app under Xvfb and
  # driving real X11 input: launch, palette open/filter/navigate/escape,
  # theme cycle, sidebar nav, disconnected state, switcher. Run after the
  # smoke E2E passes so a launch regression fails fast before the suite.
  # Implemented as a bats suite (user decision: bats-core over bespoke
  # shell flow scripts) so results land in the GHA summary via dorny.
  user-flows:
    name: User flows
    runs-on: ubuntu-latest
    needs: desktop-e2e
    # Bats junit buffers until suite end; cap so a wedge can't eat the
    # full 6h runner cap.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libglib2.0-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev \
            xvfb xdotool imagemagick dbus-x11 openbox bats

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Build desktop binary
        run: cargo build --workspace

      - name: Run user-flow bats suite
        working-directory: e2e
        env:
          BIN: ../target/debug/openkite
          ART_ROOT: artifacts-flows
        run: |
          rm -rf artifacts-flows artifacts-junit artifacts-bats-tmp
          mkdir -p artifacts-flows artifacts-junit
          # TAP on stdout (live progress) + junit report files for dorny.
          bats --report-formatter junit --output "$PWD/artifacts-junit" \
            --tempdir "$PWD/artifacts-bats-tmp" user_flows.bats

      - name: Publish flow report to job summary
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: User flow report
          path: e2e/artifacts-junit/*.xml
          reporter: java-junit
          use-actions-summary: 'true'

      - name: Upload flow artifacts (screenshots + logs per flow)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: user-flow-artifacts
          path: e2e/artifacts-flows/
          retention-days: 7

  # Earlier-stage guard for the /openkite dispatch path (OKT-95, an OKT-94
  # follow-up). Boots the app under Xvfb with a test-only JS plugin that issues
  # a `register` POST, then asserts the dispatch returned a well-formed JSON
  # envelope, the Dioxus-side registration mirror wrote, and NO panic reached
  # app.log. The no-panic assertion is the one that catches a runtime-mirror
  # regression: the panic is contained, so the surface stays healthy and an
  # envelope/status check alone would pass it. Gated on `desktop-e2e` like the
  # other jobs, and inside e2e.yml so the workflow-level paths filter keeps it
  # off unrelated PRs.
  bridge-guard:
    name: Bridge dispatch guard
    runs-on: ubuntu-latest
    needs: desktop-e2e
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libglib2.0-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev \
            xvfb xdotool imagemagick dbus-x11 openbox

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Build desktop binary
        run: cargo build --workspace

      - name: Run bridge dispatch guard
        working-directory: e2e
        run: |
          mkdir -p artifacts-bridge-guard
          ./bridge-guard.sh ../target/debug/openkite artifacts-bridge-guard

      - name: Upload guard artifacts (app log)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bridge-guard-artifacts
          path: e2e/artifacts-bridge-guard/
          retention-days: 7

  desktop-e2e-connected:
    # Same desktop harness, but pointed at the real maklab cluster through
    # the tailscale operator's kube-apiserver proxy. Exercises the app's
    # live-data path (namespace chips, workload views, status bar) instead
    # of the disconnected empty state.
    #
    # Tailnet identity tag:k8s (see gke_GitOps services/helm/tailscale
    # ci-rbac.yaml) impersonates to cluster-admin on the apiserver proxy.
    name: Desktop E2E (connected)
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    needs: desktop-e2e
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libglib2.0-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev \
            xvfb xdotool imagemagick dbus-x11 openbox

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Build desktop binary
        run: cargo build --workspace

      # Tailnet k8s access: join tailnet (tag:k8s) + client-side kubeconfig
      # (same pattern as gke_GitOps helm_lint-test.yaml).
      - name: Connect to Tailscale
        uses: tailscale/github-action@main
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: Configure kubectl kubeconfig
        run: |
          tailscale configure kubeconfig ${{ secrets.TAILSCALE_PROXY_HOST }}
          kubectl config current-context
          kubectl get ns | head -5

      - name: Run desktop E2E under Xvfb (connected)
        working-directory: e2e
        env:
          EXPECT_CONNECTED: '1'
        run: |
          mkdir -p artifacts-connected
          KUBECONFIG="$HOME/.kube/config" ./run-desktop-e2e.sh ../target/debug/openkite artifacts-connected

      - name: Upload connected E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-e2e-connected-artifacts
          path: e2e/artifacts-connected/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────
  # Visual regression: capture 10 baseline screenshots, then pixel-diff
  # fresh runs against committed baselines (OKT-62).
  #
  # capture-baselines: runs on workflow_dispatch (capture once, download
  #   the artifact, commit PNGs to e2e/baselines/). NOT a gate — it's the
  #   one-time golden capture.
  #
  # visual-regression: runs on PR/push. Re-captures all 10 surfaces fresh
  #   and compares against committed baselines with ImageMagick compare
  #   (AE metric, ~1% tolerance for WebKit font/antialias nondeterminism).
  #   This IS the gate.
  # ─────────────────────────────────────────────────────────────────────

  capture-baselines:
    name: Capture visual baselines
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.capture_baselines }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libglib2.0-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev \
            xvfb xdotool imagemagick dbus-x11 openbox

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Build desktop binary
        run: cargo build --workspace

      - name: Capture 10 baseline screenshots
        working-directory: e2e
        run: |
          mkdir -p baselines
          ./capture-baselines.sh ../target/debug/openkite baselines

      - name: Upload baselines artifact
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: e2e/baselines/*.png
          retention-days: 30

  visual-regression:
    name: Visual regression
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    needs: desktop-e2e
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libglib2.0-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev \
            xvfb xdotool imagemagick dbus-x11 openbox

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Build desktop binary
        run: cargo build --workspace

      - name: Check baselines exist
        id: check-baselines
        run: |
          if [ -d "e2e/baselines" ] && ls e2e/baselines/*.png >/dev/null 2>&1; then
            count=$(ls e2e/baselines/*.png | wc -l)
            echo "baseline_count=$count" >> "$GITHUB_OUTPUT"
            echo "have_baselines=true" >> "$GITHUB_OUTPUT"
            echo "Found $count committed baselines"
          else
            echo "have_baselines=false" >> "$GITHUB_OUTPUT"
            echo "No committed baselines found — visual regression gate skipped (capture baselines first via workflow_dispatch)"
          fi

      - name: Run visual regression gate
        if: ${{ steps.check-baselines.outputs.have_baselines == 'true' }}
        working-directory: e2e
        run: |
          mkdir -p artifacts-vr
          ./run-visual-regression.sh ../target/debug/openkite baselines artifacts-vr

      - name: Upload visual regression artifacts
        if: ${{ always() && steps.check-baselines.outputs.have_baselines == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-artifacts
          path: e2e/artifacts-vr/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────
  # Console parity: the browser console vs the desktop console (OKT-129).
  #
  # The same surface is rendered twice from the SAME fixture payloads — once in
  # headless Chromium over the served web/dist (the deployed path: the preview
  # image is static nginx, so POST /openkite is answered by the static handler
  # and the console falls back to the fixtures it bundles), once on the real
  # binary under Xvfb with OPENKITE_CONSOLE_FIXTURES pointing at the export of
  # those same fixtures — then each side is pixel-compared against the
  # committed baselines in e2e/parity/baselines/ with the tolerance and the
  # capability-attributable allow-list in e2e/parity/parity-config.sh.
  #
  # capture-browser.mjs refuses to run unless the static host really is static
  # (no bridge host answers the probe, the fixture context is painted, fixture
  # rows are rendered), so a run cannot silently compare fixtures to fixtures.
  #
  # The existing SSR marker check (`npm run test:parity`) runs first as a fast
  # pre-check. It is NOT replaced by this job.
  # ─────────────────────────────────────────────────────────────────────
  console-parity:
    name: Console parity (browser vs desktop)
    runs-on: ubuntu-latest
    needs: desktop-e2e
    if: ${{ !cancelled() }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # fonts-ibm-plex is the console's font stack; both renderers must resolve
      # the same files, otherwise the comparison measures font fallback.
      - name: Install system deps (WebKit/GTK, X11 capture, ImageMagick, fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libglib2.0-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev \
            xvfb xdotool imagemagick dbus-x11 openbox fonts-ibm-plex

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Build desktop binary
        run: cargo build --workspace

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The browser install lives here, in the workflow — never on a dev host.
      - name: Install web dependencies and the headless browser
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Build the browser bundle (what the preview image serves)
        working-directory: web
        run: npm run build:web

      - name: Fast pre-check — SSR marker parity
        working-directory: web
        run: npm run test:parity

      # Both sides render the export of web/src/fixtures.ts; a stale committed
      # copy would mean the gate compared the wrong data, so fail instead.
      - name: Verify the committed fixture export is fresh
        working-directory: web
        run: npm run export:parity-fixtures -- --check

      - name: Serve web/dist and prove it is not a bridge host
        working-directory: web
        run: |
          python3 -m http.server -d dist 8000 >/tmp/parity-http.log 2>&1 &
          for _ in $(seq 1 20); do
            curl -sfI http://127.0.0.1:8000/ >/dev/null 2>&1 && break
            sleep 1
          done
          curl -sfI http://127.0.0.1:8000/ >/dev/null || { echo "static server never came up"; cat /tmp/parity-http.log; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8000/openkite)
          case "$code" in
            2*)
              echo "a bridge host answered POST /openkite (HTTP $code): this run would not exercise the fixture fallback"
              exit 1
              ;;
          esac
          echo "POST /openkite -> HTTP $code from the static host: the console uses its bundled fixtures"

      - name: Capture the browser console
        working-directory: web
        run: node ../e2e/parity/capture-browser.mjs http://127.0.0.1:8000 ../e2e/parity/out 800x600

      - name: Capture the desktop console (same fixtures, isolated HOME, menu bar hidden)
        working-directory: e2e
        env:
          EXPECT_DIMS: 800x600
        run: ./parity/capture-desktop.sh ../target/debug/openkite parity/out

      - name: Compare each surface against the committed baselines
        run: e2e/parity/compare.sh e2e/parity/out e2e/parity/baselines

      - name: Upload parity artifacts (captures, diff images, compare log, app logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: console-parity-artifacts
          path: e2e/parity/out/
          retention-days: 7

  # The parity reference render is the BROWSER side (the browser is the target;
  # the desktop must match it). Dispatch this to (re)capture it, download the
  # artifact, and commit the PNGs to e2e/parity/baselines/ — in the same PR as
  # the visual change they follow, never as a standalone "make CI green" commit.
  capture-parity-baselines:
    name: Capture console-parity baselines
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.capture_parity_baselines }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Same font package as the gate, so the committed render matches what the
      # gate produces on the same runner image.
      - name: Install system deps (ImageMagick + fonts for the render)
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick fonts-ibm-plex

      - name: Install web dependencies and the headless browser
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Build the browser bundle
        working-directory: web
        run: npm run build:web

      - name: Serve web/dist and prove it is not a bridge host
        working-directory: web
        run: |
          python3 -m http.server -d dist 8000 >/tmp/parity-http.log 2>&1 &
          for _ in $(seq 1 20); do
            curl -sfI http://127.0.0.1:8000/ >/dev/null 2>&1 && break
            sleep 1
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8000/openkite)
          case "$code" in
            2*) echo "a bridge host answered POST /openkite (HTTP $code)"; exit 1 ;;
          esac
          echo "POST /openkite -> HTTP $code from the static host"

      - name: Capture the browser console (the parity reference render)
        working-directory: web
        run: node ../e2e/parity/capture-browser.mjs http://127.0.0.1:8000 ../e2e/parity/out 800x600

      - name: Upload parity baselines artifact
        uses: actions/upload-artifact@v4
        with:
          name: parity-baselines
          path: e2e/parity/out/*.browser.png
          retention-days: 30

      - name: Upload the capture log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-baselines-log
          path: e2e/parity/out/*.log
          retention-days: 7
