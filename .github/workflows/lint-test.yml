name: lint-test

on:
  # `labeled`/`unlabeled` are load-bearing: the default activity types would leave
  # a pull request with its pre-label result after someone adds the staging label.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  merge_group:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fmt:
    name: Check Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check Formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Lint Code
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Lint Code
        run: cargo clippy --workspace --exclude openkite-desktop --all-targets -- -D warnings

  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Diff against the base
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          # Anything under crates/, a manifest, a build input or the workflows themselves.
          CODE_PATHS: ^(crates/|Cargo\.(toml|lock)$|rust-toolchain|Dockerfile|Tiltfile|packaging/|\.github/)
        run: |
          set -euo pipefail
          if [ "$EVENT" != 'pull_request' ]; then
            echo 'code=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE"...HEAD | grep -Eq "$CODE_PATHS"; then
            echo 'code=true' >> "$GITHUB_OUTPUT"
          else
            echo 'code=false' >> "$GITHUB_OUTPUT"
            echo 'No binary or dependency change: lint only.'
          fi

  staging-gate:
    name: Require Label
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - name: Decide whether the build runs
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          if [ "$EVENT" != 'pull_request' ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            echo 'Not a pull request: the full suite runs.'
            exit 0
          fi
          if [ "$CODE" != 'true' ]; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo 'No binary or dependency change: nothing to build or test.'
            exit 0
          fi
          if printf '%s' "$LABELS" | jq -e 'index("staging")' >/dev/null; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            echo 'staging label present: build and test.'
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo "::error::Add the \`staging\` label to build and test before merging."
            exit 1
          fi

  test:
    name: Run Tests
    needs: staging-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        if: needs.staging-gate.outputs.run == 'true'
        uses: actions/checkout@v4
      - name: Install the Rust toolchain
        if: needs.staging-gate.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@stable
      - name: Run Tests
        if: needs.staging-gate.outputs.run == 'true'
        run: cargo test --workspace --exclude openkite-desktop

  boundary:
    name: Guard Boundary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Guard Crate Boundary
        run: |
          tree="$(cargo tree -p openkite-engine --prefix none)"
          if printf '%s\n' "$tree" | grep -Eq '^(dioxus|openkite-ui) '; then
            printf '%s\n' "$tree" | grep -E '^(dioxus|openkite-ui) ' >&2
            echo "openkite-engine must not depend on the UI stack" >&2
            exit 1
          fi

  benchmark:
    name: Benchmark Volume
    needs: staging-gate
    if: needs.staging-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run the 5k-pod / 40k-object / 5k-event volume benchmark
        run: |
          cargo test -p openkite-engine --release --test bench_volume \
            -- --ignored --nocapture

  desktop:
    name: Build Desktop
    needs: staging-gate
    if: needs.staging-gate.outputs.run == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install native webview dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev
      - name: Check the desktop shell
        run: cargo check -p openkite-desktop --all-targets

  binaries:
    name: Build Binaries
    needs: staging-gate
    if: needs.staging-gate.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-amd64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: macos-26-intel
            target: darwin-amd64
          - os: macos-26
            target: darwin-arm64
          - os: windows-latest
            target: windows-amd64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Build the binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          cargo build --release -p openkite-web
          mkdir -p payload
          case "$TARGET" in
            windows-*) cp target/release/openkite-web.exe "payload/openkite-web-$TARGET.exe" ;;
            *) cp target/release/openkite-web "payload/openkite-web-$TARGET" ;;
          esac
      - name: Upload the binary
        uses: actions/upload-artifact@v4
        with:
          name: openkite-dist-${{ matrix.target }}
          path: payload/*
          if-no-files-found: error
          retention-days: 14

  exec-conformance:
    name: Run Conformance
    needs: staging-gate
    if: needs.staging-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      KIND_VERSION: v0.33.0
      KUBECTL_VERSION: v1.37.2
      KIND_CLUSTER: openkite-conformance
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install kind and kubectl
        run: |
          curl -fsSLo kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          sudo install -m 0755 kind /usr/local/bin/kind
          curl -fsSLo kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          sudo install -m 0755 kubectl /usr/local/bin/kubectl
          kubectl version --client
      - name: Create the kind cluster
        run: kind create cluster --name "${KIND_CLUSTER}" --wait 180s
      - name: Confirm the cluster answers
        run: kubectl cluster-info
      - name: Build the conformance tests
        run: cargo test -p openkite-engine --test conformance_exec --test conformance_actions --no-run
      - name: Diff exec behaviour against kubectl
        run: cargo test -p openkite-engine --test conformance_exec -- --ignored --nocapture
      - name: Exercise workload actions
        run: cargo test -p openkite-engine --test conformance_actions -- --ignored --nocapture
