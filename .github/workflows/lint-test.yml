name: lint-test

on:
  pull_request:
  # Main-scoped cache saves: rust-cache stores per-run caches, and PR-only
  # runs never populate the default branch's cache, so fresh PR branches
  # restore cold. A push run after each merge keeps `main` warm.
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  changes:
    name: Detect source changes
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.filter.outputs.src }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            src:
              - '**.rs'
              - '**/Cargo.toml'
              - 'Cargo.lock'

  fmt:
    name: Check formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Lint with clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libglib2.0-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Run tests
    runs-on: ubuntu-latest
    needs: [changes, fmt, clippy]
    steps:
      - uses: actions/checkout@v4
      - if: needs.changes.outputs.src == 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: needs.changes.outputs.src == 'true'
        name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libglib2.0-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - if: needs.changes.outputs.src == 'true'
        uses: Swatinem/rust-cache@v2
      - if: needs.changes.outputs.src == 'true'
        name: Run tests
        run: |
          set +e
          cargo test --workspace 2>&1 | tee tests.log
          status=${PIPESTATUS[0]}
          set -e
          # Summary into the GHA job summary (test-summary.py always exits 0;
          # the original cargo status propagates below).
          python3 .github/scripts/test-summary.py tests.log || true
          exit $status

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [changes, fmt, clippy]
    steps:
      - uses: actions/checkout@v4
      - if: needs.changes.outputs.src == 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: needs.changes.outputs.src == 'true'
        name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libglib2.0-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - if: needs.changes.outputs.src == 'true'
        uses: Swatinem/rust-cache@v2
      - if: needs.changes.outputs.src == 'true'
        name: Build
        run: cargo build --workspace

  coverage:
    # Phase 2.5 coverage gate (OKT-54): same workflow as tests so coverage
    # measures exactly what `cargo test` runs, gated on the same source
    # filter. Fails the PR if workspace line coverage drops below 80%.
    name: Coverage gate (≥80%)
    runs-on: ubuntu-latest
    needs: [changes, fmt, clippy]
    steps:
      - uses: actions/checkout@v4
      - if: needs.changes.outputs.src == 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: needs.changes.outputs.src == 'true'
        name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libglib2.0-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - if: needs.changes.outputs.src == 'true'
        uses: Swatinem/rust-cache@v2
      - if: needs.changes.outputs.src == 'true'
        name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked
      - if: needs.changes.outputs.src == 'true'
        name: Measure line coverage
        # --fail-under 80 enforces the Phase 2.5 gate: a PR that drops
        # workspace line coverage below 80% fails this check. The summary
        # script appends % + verdict to the GHA job summary afterwards.
        run: |
          set +e
          cargo tarpaulin --workspace --out xml --output-dir coverage/ --fail-under 80 2>&1 | tee coverage.log
          status=${PIPESTATUS[0]}
          set -e
          python3 .github/scripts/coverage-summary.py coverage/cobertura.xml 80 || true
          exit $status
      - if: needs.changes.outputs.src == 'true'
        name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/cobertura.xml
          retention-days: 14
