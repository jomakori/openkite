name: lint-test

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fmt:
    name: Check formatting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Lint with clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Lint with clippy
        run: cargo clippy --workspace --exclude openkite-desktop --all-targets -- -D warnings

  test:
    name: Run tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run tests
        run: cargo test --workspace --exclude openkite-desktop

  boundary:
    name: Guard the crate boundary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Guard the crate boundary
        run: |
          tree="$(cargo tree -p openkite-engine --prefix none)"
          if printf '%s\n' "$tree" | grep -Eq '^(dioxus|openkite-ui) '; then
            printf '%s\n' "$tree" | grep -E '^(dioxus|openkite-ui) ' >&2
            echo "openkite-engine must not depend on the UI stack" >&2
            exit 1
          fi

  benchmark:
    name: OKT-218 volume benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run the 5k-pod / 40k-object / 5k-event volume benchmark
        run: |
          cargo test -p openkite-engine --release --test bench_volume \
            -- --ignored --nocapture

  desktop:
    name: Desktop shell builds
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install native webview dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev
      - name: Check the desktop shell
        run: cargo check -p openkite-desktop --all-targets

  exec-conformance:
    name: Exec conformance against a kind cluster
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      KIND_VERSION: v0.33.0
      KUBECTL_VERSION: v1.37.2
      KIND_CLUSTER: openkite-conformance
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install kind and kubectl
        run: |
          curl -fsSLo kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          sudo install -m 0755 kind /usr/local/bin/kind
          curl -fsSLo kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          sudo install -m 0755 kubectl /usr/local/bin/kubectl
          kubectl version --client
      - name: Create the kind cluster
        run: kind create cluster --name "${KIND_CLUSTER}" --wait 180s
      - name: Confirm the cluster answers
        run: kubectl cluster-info
      - name: Build the conformance test
        run: cargo test -p openkite-engine --test conformance_exec --no-run
      - name: Diff exec behaviour against kubectl
        run: cargo test -p openkite-engine --test conformance_exec -- --ignored --nocapture
