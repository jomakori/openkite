name: lint-test

on:
  pull_request:
  # Push runs after each merge keep `main`'s rust-cache warm (PR-only runs
  # never populate the default-branch cache).
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Least privilege; the test job opts up to `checks: write` for report
# annotations.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect source changes
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.filter.outputs.src }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            src:
              - '**.rs'
              - '**/Cargo.toml'
              - 'Cargo.lock'

  fmt:
    name: Check formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-setup
        with:
          extra-components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Lint with clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-setup
        with:
          extra-components: clippy
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Run tests
    runs-on: ubuntu-latest
    needs: [changes, fmt, clippy]
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - if: needs.changes.outputs.src == 'true'
        uses: ./.github/actions/rust-setup
      - if: needs.changes.outputs.src == 'true'
        name: Install cargo-nextest
        uses: taiki-e/install-action@cargo-nextest
      - if: needs.changes.outputs.src == 'true'
        name: Run tests
        run: cargo nextest run --profile ci --workspace
      # Report even on failure so a red suite is visible; action_fail gates.
      - if: always() && needs.changes.outputs.src == 'true'
        name: Publish test report
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: target/nextest/ci/junit.xml
          check_name: Test report
          action_fail: true
          action_fail_on_inconclusive: true

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [changes, fmt, clippy]
    steps:
      - uses: actions/checkout@v4
      - if: needs.changes.outputs.src == 'true'
        uses: ./.github/actions/rust-setup
      - if: needs.changes.outputs.src == 'true'
        name: Build
        run: cargo build --workspace

  coverage:
    name: Coverage gate (≥80%)
    runs-on: ubuntu-latest
    needs: [changes, fmt, clippy]
    steps:
      - uses: actions/checkout@v4
      - if: needs.changes.outputs.src == 'true'
        uses: ./.github/actions/rust-setup
      - if: needs.changes.outputs.src == 'true'
        name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked
      - if: needs.changes.outputs.src == 'true'
        name: Measure line coverage
        # --engine llvm: the ptrace default adds -C link-dead-code, which
        # breaks pulp 0.22.3 (sarah-quinones/pulp#33). llvm avoids it and is
        # the more accurate backend.
        run: cargo tarpaulin --workspace --engine llvm --out xml --output-dir coverage/ --fail-under 80
      - if: always() && needs.changes.outputs.src == 'true'
        name: Publish coverage summary
        uses: irongut/CodeCoverageSummary@v1
        with:
          filename: coverage/cobertura.xml
          badge: true
          format: markdown
          thresholds: '80 90'
          fail_below_min: true
          output: file
      - if: always() && needs.changes.outputs.src == 'true'
        name: Add coverage to job summary
        run: cat code-coverage-results.md >> "$GITHUB_STEP_SUMMARY"
