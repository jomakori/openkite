name: lint-test

on:
  pull_request:
  # Main-scoped cache saves: rust-cache stores per-run caches, and PR-only
  # runs never populate the default branch's cache, so fresh PR branches
  # restore cold. A push run after each merge keeps `main` warm.
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  changes:
    name: Detect source changes
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.filter.outputs.src }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            src:
              - '**.rs'
              - '**/Cargo.toml'
              - 'Cargo.lock'

  fmt:
    name: Check formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Lint with clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libglib2.0-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Run tests
    runs-on: ubuntu-latest
    needs: [changes, fmt, clippy]
    permissions:
      contents: read
      # EnricoMi/publish-unit-test-result-action writes a check run
      # (annotations) and optionally comments on the PR.
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - if: needs.changes.outputs.src == 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: needs.changes.outputs.src == 'true'
        name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libglib2.0-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - if: needs.changes.outputs.src == 'true'
        uses: Swatinem/rust-cache@v2
      # cargo-nextest (prebuilt via taiki-e/install-action) runs the suite and
      # writes a JUnit report (ci profile in .config/nextest.toml). The
      # EnricoMi action below renders that report into the GHA job summary
      # and check annotations — and IS the gate (action_fail: true).
      - if: needs.changes.outputs.src == 'true'
        name: Install cargo-nextest
        uses: taiki-e/install-action@cargo-nextest
      - if: needs.changes.outputs.src == 'true'
        name: Run tests (nextest, ci profile)
        run: cargo nextest run --profile ci --workspace
      - if: always() && needs.changes.outputs.src == 'true'
        name: Publish test report (JUnit → job summary)
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: target/nextest/ci/junit.xml
          check_name: Test report
          action_fail: true
          action_fail_on_inconclusive: true

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [changes, fmt, clippy]
    steps:
      - uses: actions/checkout@v4
      - if: needs.changes.outputs.src == 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: needs.changes.outputs.src == 'true'
        name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libglib2.0-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - if: needs.changes.outputs.src == 'true'
        uses: Swatinem/rust-cache@v2
      - if: needs.changes.outputs.src == 'true'
        name: Build
        run: cargo build --workspace

  coverage:
    # Phase 2.5 coverage gate (OKT-54): same workflow as tests so coverage
    # measures exactly what the test job runs, gated on the same source
    # filter. Fails the PR if workspace line coverage drops below 80%.
    name: Coverage gate (≥80%)
    runs-on: ubuntu-latest
    needs: [changes, fmt, clippy]
    steps:
      - uses: actions/checkout@v4
      - if: needs.changes.outputs.src == 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: needs.changes.outputs.src == 'true'
        name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libglib2.0-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - if: needs.changes.outputs.src == 'true'
        uses: Swatinem/rust-cache@v2
      - if: needs.changes.outputs.src == 'true'
        name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked
      - if: needs.changes.outputs.src == 'true'
        name: Measure line coverage
        # --fail-under 80 enforces the Phase 2.5 gate: a PR that drops
        # workspace line coverage below 80% fails this check. The
        # CodeCoverageSummary action below publishes the cobertura report.
        #
        # --engine llvm: the default ptrace engine on x86_64 Linux builds
        # with -C link-dead-code, which breaks pulp 0.22.3 (const-eval
        # E0080 in scalar_simd — upstream sarah-quinones/pulp#33, unfixed).
        # llvm skips link-dead-code and is tarpaulin's more accurate backend.
        run: cargo tarpaulin --workspace --engine llvm --out xml --output-dir coverage/ --fail-under 80
      - if: always() && needs.changes.outputs.src == 'true'
        name: Publish coverage summary (cobertura → job summary)
        uses: irongut/CodeCoverageSummary@v1
        with:
          filename: coverage/cobertura.xml
          badge: true
          format: markdown
          # 80 = gate; 90 = "good" badge tier
          thresholds: '80 90'
          fail_below_min: true
          output: file
      # CodeCoverageSummary writes code-coverage-results.md; surface it as a
      # GHA job summary (same pattern EnricoMi uses natively for tests).
      - if: always() && needs.changes.outputs.src == 'true'
        name: Add coverage to job summary
        run: cat code-coverage-results.md >> "$GITHUB_STEP_SUMMARY"
