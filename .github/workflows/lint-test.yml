name: lint-test

on:
  pull_request:
  # Push runs after each merge keep `main`'s rust-cache warm (PR-only runs
  # never populate the default-branch cache).
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Least privilege; the test job opts up to `checks: write` for report
# annotations.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect source changes
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.filter.outputs.src }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            src:
              - '**.rs'
              - '**/Cargo.toml'
              - 'Cargo.lock'

  fmt:
    name: Check formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-setup
        with:
          extra-components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Lint with clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-setup
        with:
          extra-components: clippy
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Run tests
    runs-on: ubuntu-latest
    needs: [changes, fmt, clippy]
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - if: needs.changes.outputs.src == 'true'
        uses: ./.github/actions/rust-setup
      - if: needs.changes.outputs.src == 'true'
        name: Install cargo-nextest
        uses: taiki-e/install-action@cargo-nextest
      - if: needs.changes.outputs.src == 'true'
        name: Run tests
        # --config-file: nextest auto-discovers only .config/nextest.toml;
        # this repo keeps the config visible at the root (KISS), so pass it.
        run: cargo nextest run --profile ci --workspace --config-file nextest.toml
      # dorny/test-reporter: one check per commit, annotations only at
      # failure sites, no PR comment spam. Runs even on failure so a red
      # suite surfaces; fail-on-error keeps the gate. use-actions-summary
      # writes the result (incl. failures) into the GHA job summary.
      - if: always() && needs.changes.outputs.src == 'true'
        name: Test report
        uses: dorny/test-reporter@v1
        with:
          name: Test report
          path: target/nextest/ci/junit.xml
          reporter: java-junit
          fail-on-error: 'true'
          use-actions-summary: 'true'

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [changes, fmt, clippy]
    steps:
      - uses: actions/checkout@v4
      - if: needs.changes.outputs.src == 'true'
        uses: ./.github/actions/rust-setup
      - if: needs.changes.outputs.src == 'true'
        name: Build
        run: cargo build --workspace

  # ──────────────────────────────────────────────────────────────────────
  # Cross-platform portability gate (OKT-63)
  #
  # The desktop binary (openkite) needs WebKitGTK, which is Linux-only in
  # CI. But `openkite-plugin-sdk` is a pure library crate — no `desktop`
  # feature on dioxus, no system deps. Run fmt + clippy + test + build on
  # that crate across ubuntu/windows/macos to catch platform-specific
  # regressions early (e.g. `#[cfg(unix)]` paths, path separators).
  #
  # We do NOT use ./.github/actions/rust-setup here — it installs GTK apt
  # packages that don't exist on Windows/macOS runners.
  # ──────────────────────────────────────────────────────────────────────
  cross-platform:
    name: plugin-sdk cross-platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [changes]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - if: needs.changes.outputs.src == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - if: needs.changes.outputs.src == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          key: cross-${{ matrix.os }}
      - if: needs.changes.outputs.src == 'true'
        name: Check formatting
        run: cargo fmt -p openkite-plugin-sdk -- --check
      - if: needs.changes.outputs.src == 'true'
        name: Clippy
        run: cargo clippy -p openkite-plugin-sdk --all-targets -- -D warnings
      - if: needs.changes.outputs.src == 'true'
        name: Test
        run: cargo test -p openkite-plugin-sdk

  coverage:
    name: Coverage gate
    runs-on: ubuntu-latest
    needs: [changes, fmt, clippy]
    steps:
      - uses: actions/checkout@v4
      - if: needs.changes.outputs.src == 'true'
        uses: ./.github/actions/rust-setup
      - if: needs.changes.outputs.src == 'true'
        name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked
      - if: needs.changes.outputs.src == 'true'
        name: Measure line coverage
        # Gate = regression floor, not the aspirational target. Measured
        # workspace line coverage after all Phase 2.5 test PRs: 49.4%
        # (1469/2974 lines, --engine llvm, 2026-09-07). GUI/view code
        # (router, shell, palette, views) is exercised by the desktop E2E
        # (e2e.yml), which tarpaulin cannot see — so a pure unit-coverage
        # target of 80% is unreachable by design. 45% floor = current -
        # ~4pt cushion; ratchet up as headless-friendly tests land.
        #
        # --engine llvm: the ptrace default adds -C link-dead-code, which
        # breaks pulp 0.22.3 (sarah-quinones/pulp#33). llvm avoids it and is
        # the more accurate backend.
        run: cargo tarpaulin --workspace --engine llvm --out xml --output-dir coverage/ --fail-under 45
      - if: always() && needs.changes.outputs.src == 'true'
        name: Publish coverage summary
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage/cobertura.xml
          badge: true
          format: markdown
          # 45 = gate floor; 60 = "acceptable" badge tier (measured 49.4)
          thresholds: '45 60'
          fail_below_min: true
          output: file
      - if: always() && needs.changes.outputs.src == 'true'
        name: Add coverage to job summary
        run: cat code-coverage-results.md >> "$GITHUB_STEP_SUMMARY"
