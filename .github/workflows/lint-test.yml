name: lint-test

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect source changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      src: ${{ steps.filter.outputs.src }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            src:
              - '**.rs'
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - 'web/**'
              - 'crates/openkite-desktop/assets/vendored/openkite-react-spike/**'
            web:
              - 'web/**'
              - 'crates/openkite-desktop/assets/vendored/openkite-react-spike/**'
      - name: Check workflows for GNU-only sed
        run: bash .github/scripts/check-portable-sed.sh

  fmt:
    name: Check formatting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-setup
        with:
          extra-components: rustfmt
          profile: none
      - run: cargo fmt --all -- --check

  clippy:
    name: Lint with clippy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-setup
        with:
          extra-components: clippy
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Run tests
    runs-on: ubuntu-latest
    needs: [changes, fmt, clippy]
    if: needs.changes.outputs.src == 'true' || github.event_name == 'push'
    timeout-minutes: 45
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-setup
      - name: Install cargo-nextest
        uses: taiki-e/install-action@cargo-nextest
      - name: Run tests
        run: cargo nextest run --profile ci --workspace --config-file nextest.toml
      - name: Test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Test report
          path: target/nextest/ci/junit.xml
          reporter: java-junit
          fail-on-error: 'true'
          use-actions-summary: 'true'

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [changes, fmt, clippy]
    if: needs.changes.outputs.src == 'true' || github.event_name == 'push'
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-setup
      - name: Build
        run: cargo build --workspace

  bundle-freshness:
    name: Check vendored bundle freshness
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.web == 'true'
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        run: npm ci
      - name: Build web bundle
        run: npm run build
      - name: Refresh bundle metadata
        run: npm run bundle-size
      - name: Verify vendored bundle is fresh
        run: npm run check:bundle
      - name: Check browser-target fixture parity
        run: npm run test:parity

  cross-platform:
    name: plugin-sdk cross-platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [changes]
    if: needs.changes.outputs.src == 'true' || github.event_name == 'push'
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-setup
        with:
          extra-components: rustfmt,clippy
          profile: none
          cache-key: cross-${{ matrix.os }}
      - name: Check formatting
        run: cargo fmt -p openkite-plugin-sdk -- --check
      - name: Clippy
        run: cargo clippy -p openkite-plugin-sdk --all-targets -- -D warnings
      - name: Test
        run: cargo test -p openkite-plugin-sdk

  web-target:
    name: Non-desktop feature gate
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.src == 'true' || github.event_name == 'push'
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-setup
        with:
          profile: none
          cache-key: web-target
      - name: Check without the desktop feature
        run: cargo check -p openkite --no-default-features

  coverage:
    name: Coverage gate
    runs-on: ubuntu-latest
    needs: [changes, fmt, clippy]
    if: needs.changes.outputs.src == 'true' || github.event_name == 'push'
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-setup
      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked
      - name: Measure line coverage
        run: cargo tarpaulin --workspace --engine llvm --out xml --output-dir coverage/ --fail-under 45
      - name: Publish coverage summary
        if: always()
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage/cobertura.xml
          badge: true
          format: markdown
          thresholds: '45 60'
          fail_below_min: true
          output: file
      - name: Add coverage to job summary
        if: always()
        run: cat code-coverage-results.md >> "$GITHUB_STEP_SUMMARY"

  report:
    name: Track the main-branch outcome
    needs:
      - changes
      - fmt
      - clippy
      - test
      - build
      - bundle-freshness
      - cross-platform
      - web-target
      - coverage
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      actions: read
    concurrency:
      group: ci-failure-${{ github.workflow }}
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Open, update, or close the tracking issue
        uses: ./.github/actions/notify-failure
        with:
          run-id: ${{ github.run_id }}
          workflow-name: ${{ github.workflow }}
          failed: ${{ contains(needs.*.result, 'failure') }}
          cancelled: ${{ contains(needs.*.result, 'cancelled') }}
