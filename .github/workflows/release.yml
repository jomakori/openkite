name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      snapshot:
        description: Build the artifacts without publishing or touching the release
        type: boolean
        default: true

permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Build and push the arm64 image
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          build-args: |
            OPENKITE_VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/jomakori/openkite:${{ github.ref_name }}
            ghcr.io/jomakori/openkite:latest

  package:
    name: PACKAGE artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install zig (cargo-zigbuild cross-compile backend)
        uses: mlugg/setup-zig@v2
      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@cargo-zigbuild
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: ${{ (github.event_name == 'workflow_dispatch' && inputs.snapshot) && 'release --snapshot --clean --skip=publish' || 'release --clean' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
