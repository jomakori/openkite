name: Release

on:
  workflow_dispatch:
    inputs:
      targets:
        description: >-
          Comma-separated subset of release targets to require, e.g.
          "linux_amd64,macos_arm64". Accepted values: linux_amd64, linux_arm64,
          macos_amd64, macos_arm64, windows_amd64, windows_arm64. Leave empty
          (the default) to require ALL SIX — a partial release then fails the
          preflight. Only an explicit dispatch may narrow the set.
        required: false
        default: ''
        type: string
      dry_run:
        description: >-
          Validate the release (analyze + artifact preflight) without tagging,
          uploading, or updating any package manager. Never publishes.
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
  push:
    branches:
      - main
    paths:
      - '**.rs'
      - '**/Cargo.toml'
      - 'Cargo.lock'

permissions:
  contents: write
  issues: write
  pull-requests: write
  # `prepare` reads the PR build run + its artifacts from the API to decide
  # between reusing them and rebuilding.
  actions: read

# Serialize release runs: rapid consecutive merges race the checkout and
# semantic-release skips publishing ("local branch main is behind the remote"),
# producing missing/empty releases. Queued runs publish in order instead.
concurrency:
  group: openkite-release
  cancel-in-progress: false

jobs:
  analyze:
    name: Determine version
    runs-on: ubuntu-latest
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "semantic-release-bot"
          git config user.email "semantic-release-bot@users.noreply.github.com"
      - name: Run semantic-release (dry-run)
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
          dry_run: true
          extra_plugins: |
            @semantic-release/commit-analyzer
            @semantic-release/release-notes-generator
            @semantic-release/github
            semantic-release-cargo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Build-once reuse (OKT-104): find the six native packages the PR already
  # built for this commit, instead of rebuilding them here. The artifacts are
  # version-agnostic; the analyzed version is applied to the asset names at
  # publish time.
  prepare:
    name: Locate reusable artifacts
    runs-on: ubuntu-latest
    needs: analyze
    if: >-
      needs.analyze.outputs.new_release_published == 'true' ||
      inputs.dry_run == 'true'
    outputs:
      reuse: ${{ steps.locate.outputs.reuse }}
      run_id: ${{ steps.locate.outputs.run_id }}
    steps:
      # Without a checkout the workspace has no `.github/scripts/`, so the
      # locator below died with "No such file or directory" (exit 127) and the
      # whole reuse/rebuild path was unreachable.
      - name: Checkout
        uses: actions/checkout@v4
      # Squash merges mint a new SHA, so this maps the merged commit back to
      # the PR head the build ran on, then verifies a complete, unexpired set
      # exists. `reuse=false` engages the rebuild fallback below.
      - name: Locate PR-built artifacts for the merged commit
        id: locate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/locate-release-artifacts.sh "${{ github.sha }}"

  # Fallback only: no complete reusable artifact set exists for this commit
  # (artifact expiry, force-push, a cancelled/failed PR build, or a direct push
  # to main). Publishing must never be blocked by artifact GC, so rebuild with
  # the analyzed version embedded. Same reusable workflow the PRs run.
  build-artifacts:
    name: Rebuild release artifacts (fallback)
    needs: [analyze, prepare]
    # A dry run never rebuilds: its job is to exercise the preflight against
    # whatever (possibly empty) set the downloads produced, not to burn six
    # native builds.
    if: >-
      needs.analyze.outputs.new_release_published == 'true' &&
      needs.prepare.outputs.reuse != 'true' &&
      inputs.dry_run != 'true'
    uses: ./.github/workflows/build-release-artifacts.yml
    with:
      version: ${{ needs.analyze.outputs.new_release_version }}
      package: true
      retention-days: 7

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [analyze, prepare, build-artifacts]
    # Succeed when the reusable set was reused (build-artifacts skipped) or the
    # fallback rebuilt successfully; never publish a partial set. A dry run is
    # allowed through even without a release decision so the preflight can be
    # exercised; its publishing steps are separately gated off below.
    if: >-
      always() &&
      (inputs.dry_run == 'true' ||
       (needs.analyze.outputs.new_release_published == 'true' &&
        needs.prepare.result == 'success' &&
        (needs.build-artifacts.result == 'success' || needs.build-artifacts.result == 'skipped')))
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Check out the live tip of main, not the triggering commit: with
          # rapid consecutive merges the trigger commit can be behind origin/main
          # and semantic-release refuses to publish (empty release bodies).
          ref: main
      - name: Configure git
        run: |
          git config user.name "semantic-release-bot"
          git config user.email "semantic-release-bot@users.noreply.github.com"
      - name: Download reused artifacts
        if: needs.prepare.outputs.reuse == 'true'
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ needs.prepare.outputs.run_id }}
          pattern: openkite_*
          path: dist
          merge-multiple: true
      - name: Download fallback-built artifacts
        if: needs.prepare.outputs.reuse != 'true' && inputs.dry_run != 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: openkite_*
          path: dist
          merge-multiple: true
      # The fail-safe gate. It runs unconditionally on every publish
      # attempt, requires all six targets by default, and fails the job before
      # anything is tagged or uploaded. `targets` can only come from an explicit
      # workflow_dispatch.
      - name: Preflight — refuse an incomplete release
        env:
          VERSION: ${{ needs.analyze.outputs.new_release_version || '0.0.0' }}
          TARGETS: ${{ inputs.targets }}
        run: |
          mkdir -p dist
          bash .github/scripts/normalize-release-assets.sh dist "$VERSION" "$TARGETS"
      - name: Publish release (tag + notes)
        if: inputs.dry_run != 'true'
        uses: cycjimmy/semantic-release-action@v4
        with:
          extra_plugins: |
            @semantic-release/commit-analyzer
            @semantic-release/release-notes-generator
            @semantic-release/github
            semantic-release-cargo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload artifacts to release
        if: inputs.dry_run != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.analyze.outputs.new_release_version }}
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-tap:
    name: Update homebrew tap (jomakori/homebrew-tap)
    runs-on: ubuntu-latest
    needs: [analyze, publish]
    if: needs.analyze.outputs.new_release_published == 'true' && inputs.dry_run != 'true'
    steps:
      # Digests set by release-digest (GITHUB_ENV) persist across the tap
      # checkout below — env file is job-scoped, applied after every step.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read dmg digests
        uses: ./.github/actions/release-digest
        with:
          version: ${{ needs.analyze.outputs.new_release_version }}
          repo: jomakori/openkite
          map: |
            .*_macos_arm64\.dmg=ARM_SHA
            .*_macos_amd64\.dmg=AMD_SHA
      - name: Source tarball sha
        env:
          VERSION: ${{ needs.analyze.outputs.new_release_version }}
        run: |
          set -euo pipefail
          SRC_SHA=$(curl -sL "https://github.com/jomakori/openkite/archive/refs/tags/v${VERSION}.tar.gz" | shasum -a 256 | awk '{print $1}')
          test -n "$SRC_SHA" || { echo "source tarball fetch failed"; exit 1; }
          echo "SRC_SHA=$SRC_SHA" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Checkout tap
        uses: actions/checkout@v4
        with:
          repository: jomakori/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          fetch-depth: 0
      - name: Update cask
        run: |
          set -euo pipefail
          CASK=Casks/openkite.rb
          sed -i.bak "s/^  version .*/  version \"${VERSION}\"/" "$CASK"
          rm -f "$CASK.bak"
          awk -v arm="$ARM_SHA" -v amd="$AMD_SHA" '
            /on_arm do/ { in_arm=1 }
            in_arm && /sha256/ { sub(/sha256 ".*"/, "sha256 \"" arm "\""); in_arm=0 }
            /on_intel do/ { in_intel=1 }
            in_intel && /sha256/ { sub(/sha256 ".*"/, "sha256 \"" amd "\""); in_intel=0 }
            { print }
          ' "$CASK" > "$CASK.tmp" && mv "$CASK.tmp" "$CASK"
          grep -q "version \"${VERSION}\"" "$CASK"
          grep -q "sha256 \"${ARM_SHA}\"" "$CASK"
          grep -q "sha256 \"${AMD_SHA}\"" "$CASK"
      - name: Update formula
        run: |
          set -euo pipefail
          FORMULA=Formula/openkite.rb
          sed -i.bak "s|refs/tags/v[0-9.]*\.tar.gz|refs/tags/v${VERSION}.tar.gz|" "$FORMULA"
          rm -f "$FORMULA.bak"
          sed -i.bak "s/^  sha256 .*/  sha256 \"${SRC_SHA}\"/" "$FORMULA"
          rm -f "$FORMULA.bak"
          grep -q "refs/tags/v${VERSION}.tar.gz" "$FORMULA"
          grep -q "sha256 \"${SRC_SHA}\"" "$FORMULA"
      - name: Commit + push
        run: |
          git config user.name "semantic-release-bot"
          git config user.email "semantic-release-bot@users.noreply.github.com"
          git add Casks/openkite.rb Formula/openkite.rb
          if git diff --cached --quiet; then
            echo "brew files unchanged"
          else
            git commit -m "openkite v${VERSION}"
            git push
          fi

  publish-choco:
    name: Publish chocolatey package (GH Packages)
    runs-on: windows-latest
    needs: [analyze, publish]
    if: needs.analyze.outputs.new_release_published == 'true' && inputs.dry_run != 'true'
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Read exe digests
        uses: ./.github/actions/release-digest
        with:
          version: ${{ needs.analyze.outputs.new_release_version }}
          repo: jomakori/openkite
          map: |
            .*_windows_amd64\.exe=AMD_SHA
            .*_windows_arm64\.exe=ARM_SHA
      - name: Update package
        env:
          VERSION: ${{ needs.analyze.outputs.new_release_version }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ps1 = 'choco/tools/chocolateyinstall.ps1'
          (Get-Content $ps1 -Raw) `
            -replace "\`$version = '.*'", "\`$version = '$env:VERSION'" `
            -replace "\`$amd64Checksum = '.*'", "\`$amd64Checksum = '$env:AMD_SHA'" `
            -replace "\`$arm64Checksum = '.*'", "\`$arm64Checksum = '$env:ARM_SHA'" |
            Set-Content $ps1 -NoNewline
          $nuspec = 'choco/openkite.nuspec'
          (Get-Content $nuspec -Raw) -replace '<version>.*</version>', "<version>$env:VERSION</version>" |
            Set-Content $nuspec -NoNewline
      - name: choco pack
        env:
          VERSION: ${{ needs.analyze.outputs.new_release_version }}
        shell: pwsh
        run: |
          choco pack choco/openkite.nuspec --outputdirectory dist
      - name: Push to GitHub Packages
        env:
          VERSION: ${{ needs.analyze.outputs.new_release_version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          choco push "dist/openkite.$env:VERSION.nupkg" `
            --source "https://nuget.pkg.github.com/jomakori/index.json" `
            --api-key $env:GH_TOKEN
      - name: Attach nupkg to release
        env:
          VERSION: ${{ needs.analyze.outputs.new_release_version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release upload "v$env:VERSION" "dist/openkite.$env:VERSION.nupkg" --repo jomakori/openkite --clobber
