name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  packages: write
  pull-requests: read

jobs:
  build:
    name: Build Release
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    outputs:
      version: ${{ steps.tag.outputs.version }}
      published: ${{ steps.release.outputs.published }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v4.0.1

      - name: Fetch Doppler Secrets
        id: doppler
        uses: dopplerhq/secrets-fetch-action@v2.0.0
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}
          inject-env-vars: true

      - name: Install svu
        run: |
          gh release download -R caarlos0/svu -p 'svu_*_linux_amd64.tar.gz' -D "$RUNNER_TEMP/svu" --clobber
          tar -xzf "$RUNNER_TEMP"/svu/*.tar.gz -C /usr/local/bin svu
          svu --version

      - name: Tag the next version
        id: tag
        run: |
          set -euo pipefail
          current="$(svu current)"
          next="$(svu next)"
          echo "current=$current next=$next" >> "$GITHUB_STEP_SUMMARY"
          if [ "$current" = "$next" ]; then
            if git rev-parse -q --verify "refs/tags/$current" >/dev/null \
              && ! gh release view "$current" >/dev/null 2>&1; then
              echo "Resuming unpublished $current." >> "$GITHUB_STEP_SUMMARY"
              echo "version=${current#v}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "No releasable commits since $current — nothing to tag."
            exit 0
          fi
          git tag "$next"
          git push origin "$next"
          echo "version=${next#v}" >> "$GITHUB_OUTPUT"

      - name: Find the pull request build for this commit
        id: find
        if: steps.tag.outputs.version != ''
        env:
          TAG: v${{ steps.tag.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          commit="$(gh api "repos/$REPO/commits/$TAG" --jq '.sha')"
          pr="$(gh api "repos/$REPO/commits/$commit/pulls" --jq '.[0].number // empty')"
          if [ -z "$pr" ]; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            echo "::notice::No pull request is associated with $TAG, so there is no build to publish."
            exit 0
          fi
          head="$(gh api "repos/$REPO/pulls/$pr" --jq '.head.sha')"
          run_id="$(gh api \
            "repos/$REPO/actions/workflows/lint-test.yml/runs?head_sha=$head&status=success&per_page=1" \
            --jq '.workflow_runs[0].id // empty')"
          if [ -z "$run_id" ]; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            echo "::notice::No successful lint-test run for pr-$pr, so there is nothing to publish."
            exit 0
          fi
          binaries="$(gh api "repos/$REPO/actions/runs/$run_id/artifacts?per_page=100" \
            --jq '[.artifacts[] | select(.name | startswith("openkite-dist-"))] | length')"
          if [ "$binaries" = '0' ]; then
            built="$(gh api "repos/$REPO/actions/runs/$run_id/jobs?per_page=100" \
              --jq '[.jobs[] | select(.name | startswith("Build Binaries")) | .conclusion] | unique | join(",")')"
            if [ "$built" = 'success' ]; then
              echo "::error::Run $run_id built the binaries but carries no openkite-dist artifacts:" \
                "they expired or were deleted. Re-run lint-test for $head."
              exit 1
            fi
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            echo "::notice::Run $run_id skipped the binary build: the pull request changed no build input."
            exit 0
          fi
          {
            echo "pr=$pr"
            echo "run_id=$run_id"
            echo "image=pr-${pr}-${head:0:7}"
          } >> "$GITHUB_OUTPUT"

      - name: Withdraw the tag when there is nothing to publish
        if: steps.find.outputs.skip == 'true'
        env:
          TAG: v${{ steps.tag.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            gh api -X DELETE "repos/$REPO/git/refs/tags/$TAG"
            echo "Withdrew $TAG: no build to publish." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Download the binaries built for the pull request
        if: steps.find.outputs.run_id != ''
        uses: actions/download-artifact@v8
        with:
          pattern: openkite-dist-*
          merge-multiple: true
          path: dist
          run-id: ${{ steps.find.outputs.run_id }}
          github-token: ${{ steps.doppler.outputs.GITHUB_TOKEN }}

      - name: Package the binaries
        if: steps.find.outputs.run_id != ''
        shell: bash
        env:
          VERSION: v${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p out
          for binary in dist/openkite-web-*; do
            name="$(basename "$binary")"
            platform="${name#openkite-web-}"
            platform="${platform%.exe}"
            platform="${platform//-/_}"
            tar -czf "out/openkite_${VERSION}_${platform}.tar.gz" -C dist "$name"
          done
          if [ -z "$(ls -A out 2>/dev/null)" ]; then
            echo "::error::The pull request run produced no binaries, so there is nothing to publish."
            exit 1
          fi
          (cd out && sha256sum ./*.tar.gz > checksums.txt)
          ls -lh out

      - name: Confirm the pull request image exists
        if: steps.find.outputs.run_id != ''
        run: |
          set -euo pipefail
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          source="ghcr.io/jomakori/openkite:${{ steps.find.outputs.image }}"
          if ! docker buildx imagetools inspect "$source" >/dev/null 2>&1; then
            echo "::error::$source is missing: Staging never built an image for this pull request."
            exit 1
          fi

      - name: Create the release with generated notes
        id: release
        if: steps.find.outputs.run_id != ''
        run: |
          set -euo pipefail
          tag="v${{ steps.tag.outputs.version }}"
          gh release create "$tag" \
            --title "$tag" \
            --generate-notes \
            --verify-tag
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Upload the release assets
        if: steps.release.outputs.published == 'true'
        run: |
          set -euo pipefail
          tag="v${{ steps.tag.outputs.version }}"
          gh release upload "$tag" out/* --clobber

      - name: Retag the pull request image as the release
        if: steps.release.outputs.published == 'true'
        run: |
          set -euo pipefail
          source="ghcr.io/jomakori/openkite:${{ steps.find.outputs.image }}"
          tag="ghcr.io/jomakori/openkite:v${{ steps.tag.outputs.version }}"
          docker buildx imagetools create -t "$tag" -t ghcr.io/jomakori/openkite:latest "$source"
          docker buildx imagetools inspect "$tag"

      - name: Queue the Flatpak bundle
        if: steps.release.outputs.published == 'true'
        env:
          TAG: v${{ steps.tag.outputs.version }}
        run: gh workflow run flatpak.yml --ref main -f tag="$TAG"

      - name: Queue the Chocolatey package
        if: steps.release.outputs.published == 'true'
        env:
          TAG: v${{ steps.tag.outputs.version }}
        run: gh workflow run chocolatey.yml --ref main -f tag="$TAG"

      - name: Delete the pull request artifacts
        if: steps.release.outputs.published == 'true'
        env:
          REPO: ${{ github.repository }}
          PR: ${{ steps.find.outputs.pr }}
        run: |
          set -euo pipefail
          head="$(gh api "repos/$REPO/pulls/$PR" --jq '.head.sha')"
          gh api "repos/$REPO/actions/runs?head_sha=$head&per_page=100" \
            --jq '.workflow_runs[].id' | while read -r run; do
              gh api "repos/$REPO/actions/runs/$run/artifacts" \
                --jq '.artifacts[] | select(.name | startswith("openkite-")) | .id' \
              | while read -r artifact; do
                  gh api -X DELETE "repos/$REPO/actions/artifacts/$artifact"
                  echo "deleted artifact $artifact from run $run"
                done
            done

  deploy:
    name: Deploy Release
    needs: build
    if: needs.build.outputs.published == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Fetch Doppler Secrets
        id: doppler
        uses: dopplerhq/secrets-fetch-action@v2.0.0
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}

      - name: Checkout the GitOps repo
        uses: actions/checkout@v7
        with:
          repository: jomakori/gke_GitOps
          ref: main
          token: ${{ steps.doppler.outputs.GITHUB_TOKEN }}
          path: gitops

      - name: Pin the production tag
        env:
          TAG: v${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          yq -i '.openkite.environments.production.tag = strenv(TAG)' gitops/apps/helm/values.yaml
          cd gitops
          if git diff --quiet; then
            echo "Pin already at ${TAG}; nothing to move."
            exit 0
          fi
          git -c user.name="openkite-release[bot]" \
              -c user.email="openkite-release@users.noreply.github.com" \
              commit -q -am "chore(apps): pin openkite prod to ${TAG}"
          git push -q origin HEAD:main
          echo "Prod pinned to ${TAG}." >> "$GITHUB_STEP_SUMMARY"
