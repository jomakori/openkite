name: Release

on:
  workflow_dispatch:
    inputs:
      targets:
        description: >-
          Comma-separated subset of release targets to require, e.g.
          "linux_amd64,macos_arm64". Accepted values: linux_amd64, linux_arm64,
          macos_amd64, macos_arm64, windows_amd64, windows_arm64. Leave empty
          (the default) to require ALL SIX — a partial release then fails the
          preflight. Only an explicit dispatch may narrow the set.
        required: false
        default: ''
        type: string
      dry_run:
        description: >-
          Validate the release (analyze + artifact preflight) without tagging,
          uploading, or updating any package manager. Never publishes.
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
  push:
    branches:
      - main
    paths:
      - '**.rs'
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - 'web/**'
      - 'crates/openkite-desktop/assets/**'
      - 'crates/openkite-desktop/Dioxus.toml'
      - 'crates/openkite-desktop/icons/**'
      - '.github/workflows/build-e2e.yml'
      - '.github/workflows/release.yml'
      - '.github/actions/build-release-artifacts/**'
      - '.github/actions/build-image/**'
      - '.github/actions/rust-setup/**'
      - '.github/scripts/**'

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read

concurrency:
  group: openkite-release
  cancel-in-progress: false

jobs:
  analyze:
    name: Determine version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "semantic-release-bot"
          git config user.email "semantic-release-bot@users.noreply.github.com"
      - name: Run semantic-release (dry-run)
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
          dry_run: true
          extra_plugins: |
            @semantic-release/commit-analyzer
            @semantic-release/release-notes-generator
            @semantic-release/github
            semantic-release-cargo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  locate:
    name: Locate the merged PR's packages
    runs-on: ubuntu-latest
    needs: [analyze]
    if: >-
      needs.analyze.outputs.new_release_published == 'true' ||
      inputs.dry_run == 'true'
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      reuse: ${{ steps.locate.outputs.reuse }}
      run_id: ${{ steps.locate.outputs.run_id }}
      source_sha: ${{ steps.locate.outputs.source_sha }}
      preview_tag: ${{ steps.locate.outputs.preview_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Locate the PR build for this commit
        id: locate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/locate-release-artifacts.sh "${{ github.sha }}"

  packages:
    name: Rebuild the release packages (fallback)
    runs-on: ${{ matrix.os }}
    needs: [analyze, locate]
    if: >-
      needs.analyze.outputs.new_release_published == 'true' &&
      needs.locate.outputs.reuse != 'true' &&
      inputs.dry_run != 'true'
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            package_os: linux
            package_arch: amd64
            formats: appimage
            ext: AppImage
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            package_os: linux
            package_arch: arm64
            formats: appimage
            ext: AppImage
          - os: macos-26
            target: aarch64-apple-darwin
            package_os: macos
            package_arch: arm64
            formats: dmg
            ext: dmg
          - os: macos-26-intel
            target: x86_64-apple-darwin
            package_os: macos
            package_arch: amd64
            formats: dmg
            ext: dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            package_os: windows
            package_arch: amd64
            formats: nsis
            ext: exe
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            package_os: windows
            package_arch: arm64
            formats: nsis
            ext: exe
    steps:
      - name: Build, package, and upload the release asset
        uses: ./.github/actions/build-release-artifacts
        with:
          target: ${{ matrix.target }}
          package-os: ${{ matrix.package_os }}
          package-arch: ${{ matrix.package_arch }}
          formats: ${{ matrix.formats }}
          ext: ${{ matrix.ext }}
          version: ${{ needs.analyze.outputs.new_release_version }}
          retention-days: '7'

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [analyze, locate, packages]
    if: >-
      always() &&
      (inputs.dry_run == 'true' ||
       (needs.analyze.outputs.new_release_published == 'true' &&
        needs.locate.result == 'success' &&
        (needs.packages.result == 'success' || needs.packages.result == 'skipped')))
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Configure git
        run: |
          git config user.name "semantic-release-bot"
          git config user.email "semantic-release-bot@users.noreply.github.com"
      - name: Download the release packages
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ needs.locate.outputs.run_id || github.run_id }}
          pattern: openkite_*
          path: dist
          merge-multiple: true
      - name: Preflight — refuse an incomplete release
        env:
          VERSION: ${{ needs.analyze.outputs.new_release_version || '0.0.0' }}
          TARGETS: ${{ inputs.targets }}
        run: |
          mkdir -p dist
          bash .github/scripts/normalize-release-assets.sh dist "$VERSION" "$TARGETS"
      - name: Publish release (tag + notes)
        if: inputs.dry_run != 'true'
        uses: cycjimmy/semantic-release-action@v4
        with:
          extra_plugins: |
            @semantic-release/commit-analyzer
            @semantic-release/release-notes-generator
            @semantic-release/github
            semantic-release-cargo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload artifacts to release
        if: inputs.dry_run != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.analyze.outputs.new_release_version }}
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    name: Promote the preview image to the release tag
    runs-on: ubuntu-latest
    needs: [analyze, locate, publish]
    if: needs.analyze.outputs.new_release_published == 'true' && inputs.dry_run != 'true'
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      promoted: ${{ steps.promote.outputs.promoted }}
      image_digest: ${{ steps.promote.outputs.image_digest }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Promote the PR image digest
        id: promote
        env:
          PREVIEW_TAG: ${{ needs.locate.outputs.preview_tag }}
          VERSION: ${{ needs.analyze.outputs.new_release_version }}
        run: |
          set -euo pipefail
          image="ghcr.io/jomakori/openkite"
          if [ -z "$PREVIEW_TAG" ]; then
            echo "promoted=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=No PR image for this commit::the rebuild fallback publishes it"
            exit 0
          fi
          if ! docker buildx imagetools inspect "${image}:${PREVIEW_TAG}" >/dev/null 2>&1; then
            echo "promoted=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=No published preview image::${PREVIEW_TAG} is absent, rebuilding"
            exit 0
          fi
          docker buildx imagetools create --tag "${image}:v${VERSION}" "${image}:${PREVIEW_TAG}"
          digest="$(docker buildx imagetools inspect "${image}:v${VERSION}" --format '{{.Manifest.Digest}}')"
          echo "promoted=true" >> "$GITHUB_OUTPUT"
          echo "image_digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "promoted ${image}:${PREVIEW_TAG} to v${VERSION} (${digest})"

  image-rebuild:
    name: Rebuild the release image (fallback)
    runs-on: ubuntu-latest
    needs: [analyze, locate, publish, image]
    if: >-
      always() &&
      needs.analyze.outputs.new_release_published == 'true' &&
      inputs.dry_run != 'true' &&
      needs.publish.result == 'success' &&
      needs.image.outputs.promoted != 'true'
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Build and publish v<version>
        id: build
        uses: ./.github/actions/build-image
        with:
          ref: v${{ needs.analyze.outputs.new_release_version }}
          tag: v${{ needs.analyze.outputs.new_release_version }}
          host: openkite.maklab.net

  manifest:
    name: Attach the release manifest
    runs-on: ubuntu-latest
    needs: [analyze, publish, image, image-rebuild]
    if: >-
      always() &&
      needs.analyze.outputs.new_release_published == 'true' &&
      inputs.dry_run != 'true' &&
      needs.publish.result == 'success'
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Read the package digests
        uses: ./.github/actions/release-digest
        with:
          version: ${{ needs.analyze.outputs.new_release_version }}
          repo: jomakori/openkite
          map: |
            .*_linux_amd64\.AppImage=LINUX_AMD64_SHA
            .*_linux_arm64\.AppImage=LINUX_ARM64_SHA
            .*_macos_amd64\.dmg=MACOS_AMD64_SHA
            .*_macos_arm64\.dmg=MACOS_ARM64_SHA
            .*_windows_amd64\.exe=WINDOWS_AMD64_SHA
            .*_windows_arm64\.exe=WINDOWS_ARM64_SHA
      - name: Write the manifest
        env:
          VERSION: ${{ needs.analyze.outputs.new_release_version }}
          IMAGE_DIGEST: >-
            ${{ needs.image.outputs.image_digest || needs.image-rebuild.outputs.image_digest }}
        run: |
          set -euo pipefail
          test -n "$IMAGE_DIGEST" || {
            echo "::error title=No image digest::no v${VERSION} image was published or promoted"
            exit 1
          }
          mkdir -p dist
          {
            echo "# openkite v${VERSION} release manifest"
            echo ""
            echo "| artifact | sha256 |"
            echo "|---|---|"
            echo "| openkite_${VERSION}_linux_amd64.AppImage | \`${LINUX_AMD64_SHA}\` |"
            echo "| openkite_${VERSION}_linux_arm64.AppImage | \`${LINUX_ARM64_SHA}\` |"
            echo "| openkite_${VERSION}_macos_amd64.dmg | \`${MACOS_AMD64_SHA}\` |"
            echo "| openkite_${VERSION}_macos_arm64.dmg | \`${MACOS_ARM64_SHA}\` |"
            echo "| openkite_${VERSION}_windows_amd64.exe | \`${WINDOWS_AMD64_SHA}\` |"
            echo "| openkite_${VERSION}_windows_arm64.exe | \`${WINDOWS_ARM64_SHA}\` |"
            echo "| ghcr.io/jomakori/openkite:v${VERSION} | \`${IMAGE_DIGEST}\` |"
          } > "dist/openkite_${VERSION}_release-manifest.md"
          cat "dist/openkite_${VERSION}_release-manifest.md"
      - name: Attach the manifest to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.analyze.outputs.new_release_version }}
          files: dist/openkite_*_release-manifest.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tap:
    name: Update homebrew tap (jomakori/homebrew-tap)
    runs-on: ubuntu-latest
    needs: [analyze, publish]
    if: needs.analyze.outputs.new_release_published == 'true' && inputs.dry_run != 'true'
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read dmg digests
        uses: ./.github/actions/release-digest
        with:
          version: ${{ needs.analyze.outputs.new_release_version }}
          repo: jomakori/openkite
          map: |
            .*_macos_arm64\.dmg=ARM_SHA
            .*_macos_amd64\.dmg=AMD_SHA
      - name: Source tarball sha
        env:
          VERSION: ${{ needs.analyze.outputs.new_release_version }}
        run: |
          set -euo pipefail
          tarball="https://github.com/jomakori/openkite/archive/refs/tags/v${VERSION}.tar.gz"
          SRC_SHA=$(curl -sL "$tarball" | shasum -a 256 | awk '{print $1}')
          test -n "$SRC_SHA" || { echo "source tarball fetch failed"; exit 1; }
          echo "SRC_SHA=$SRC_SHA" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Checkout tap
        uses: actions/checkout@v4
        with:
          repository: jomakori/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          fetch-depth: 0
      - name: Update cask
        run: |
          set -euo pipefail
          CASK=Casks/openkite.rb
          sed -i.bak "s/^  version .*/  version \"${VERSION}\"/" "$CASK"
          rm -f "$CASK.bak"
          awk -v arm="$ARM_SHA" -v amd="$AMD_SHA" '
            /on_arm do/ { in_arm=1 }
            in_arm && /sha256/ { sub(/sha256 ".*"/, "sha256 \"" arm "\""); in_arm=0 }
            /on_intel do/ { in_intel=1 }
            in_intel && /sha256/ { sub(/sha256 ".*"/, "sha256 \"" amd "\""); in_intel=0 }
            { print }
          ' "$CASK" > "$CASK.tmp" && mv "$CASK.tmp" "$CASK"
          grep -q "version \"${VERSION}\"" "$CASK"
          grep -q "sha256 \"${ARM_SHA}\"" "$CASK"
          grep -q "sha256 \"${AMD_SHA}\"" "$CASK"
      - name: Update formula
        run: |
          set -euo pipefail
          FORMULA=Formula/openkite.rb
          sed -i.bak "s|refs/tags/v[0-9.]*\.tar.gz|refs/tags/v${VERSION}.tar.gz|" "$FORMULA"
          rm -f "$FORMULA.bak"
          sed -i.bak "s/^  sha256 .*/  sha256 \"${SRC_SHA}\"/" "$FORMULA"
          rm -f "$FORMULA.bak"
          grep -q "refs/tags/v${VERSION}.tar.gz" "$FORMULA"
          grep -q "sha256 \"${SRC_SHA}\"" "$FORMULA"
      - name: Commit + push
        run: |
          git config user.name "semantic-release-bot"
          git config user.email "semantic-release-bot@users.noreply.github.com"
          git add Casks/openkite.rb Formula/openkite.rb
          if git diff --cached --quiet; then
            echo "brew files unchanged"
          else
            git commit -m "openkite v${VERSION}"
            git push
          fi

  choco:
    name: Publish chocolatey package (GH Packages)
    runs-on: windows-latest
    needs: [analyze, publish]
    if: needs.analyze.outputs.new_release_published == 'true' && inputs.dry_run != 'true'
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Read exe digests
        uses: ./.github/actions/release-digest
        with:
          version: ${{ needs.analyze.outputs.new_release_version }}
          repo: jomakori/openkite
          map: |
            .*_windows_amd64\.exe=AMD_SHA
            .*_windows_arm64\.exe=ARM_SHA
      - name: Update package
        env:
          VERSION: ${{ needs.analyze.outputs.new_release_version }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ps1 = 'choco/tools/chocolateyinstall.ps1'
          (Get-Content $ps1 -Raw) `
            -replace "\`$version = '.*'", "\`$version = '$env:VERSION'" `
            -replace "\`$amd64Checksum = '.*'", "\`$amd64Checksum = '$env:AMD_SHA'" `
            -replace "\`$arm64Checksum = '.*'", "\`$arm64Checksum = '$env:ARM_SHA'" |
            Set-Content $ps1 -NoNewline
          $nuspec = 'choco/openkite.nuspec'
          (Get-Content $nuspec -Raw) -replace '<version>.*</version>', "<version>$env:VERSION</version>" |
            Set-Content $nuspec -NoNewline
      - name: choco pack
        env:
          VERSION: ${{ needs.analyze.outputs.new_release_version }}
        shell: pwsh
        run: |
          choco pack choco/openkite.nuspec --outputdirectory dist
      - name: Push to GitHub Packages
        env:
          VERSION: ${{ needs.analyze.outputs.new_release_version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          choco push "dist/openkite.$env:VERSION.nupkg" `
            --source "https://nuget.pkg.github.com/jomakori/index.json" `
            --api-key $env:GH_TOKEN
      - name: Attach nupkg to release
        env:
          VERSION: ${{ needs.analyze.outputs.new_release_version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release upload "v$env:VERSION" "dist/openkite.$env:VERSION.nupkg" --repo jomakori/openkite --clobber

  report:
    name: Track the main-branch outcome
    needs:
      - analyze
      - locate
      - packages
      - publish
      - image
      - image-rebuild
      - manifest
      - tap
      - choco
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      actions: read
    concurrency:
      group: ci-failure-${{ github.workflow }}
      cancel-in-progress: false
    steps:
      - name: Open, update, or close the tracking issue
        uses: ./.github/actions/notify-failure
        with:
          run-id: ${{ github.run_id }}
          workflow-name: ${{ github.workflow }}
          failed: ${{ contains(needs.*.result, 'failure') }}
          cancelled: ${{ contains(needs.*.result, 'cancelled') }}
