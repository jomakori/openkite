name: Release

# One workflow per release, run only when a human dispatches it: a merge to main
# never tags. svu derives the next version from the commits since the last tag and
# pushes it; the binaries come from the successful lint-test run of the pull
# request that merged, so nothing is built twice; the image Staging built for that
# pull request is retagged, not rebuilt. A tag pushed with GITHUB_TOKEN does not
# trigger another workflow, so the Flatpak and Chocolatey files are queued here
# through workflow_dispatch, which is the one event that exemption does not cover.

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  packages: write
  pull-requests: read

jobs:
  resolve-version:
    name: Resolve Version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Check out the full history and tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install svu
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download -R caarlos0/svu -p 'svu_*_linux_amd64.tar.gz' -D "$RUNNER_TEMP/svu" --clobber
          tar -xzf "$RUNNER_TEMP"/svu/*.tar.gz -C /usr/local/bin svu
          svu --version
      - name: Tag the next version
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          current="$(svu current)"
          next="$(svu next)"
          echo "current=$current next=$next" >> "$GITHUB_STEP_SUMMARY"
          if [ "$current" = "$next" ]; then
            # An earlier run may have tagged the version and died before publishing it.
            if git rev-parse -q --verify "refs/tags/$current" >/dev/null \
              && ! gh release view "$current" >/dev/null 2>&1; then
              echo "Resuming unpublished $current." >> "$GITHUB_STEP_SUMMARY"
              echo "version=${current#v}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "No releasable commits since $current — nothing to tag."
            exit 0
          fi
          git tag "$next"
          git push origin "$next"
          echo "version=${next#v}" >> "$GITHUB_OUTPUT"

  locate-build:
    name: Locate Build
    needs: resolve-version
    if: needs.resolve-version.outputs.version != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      skip: ${{ steps.find.outputs.skip }}
      run_id: ${{ steps.find.outputs.run_id }}
      pr: ${{ steps.find.outputs.pr }}
      image: ${{ steps.find.outputs.image }}
    steps:
      - name: Find the pull request build for this commit
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The tagged commit, not the dispatch commit: a resumed release publishes
          # the build that was made for the version being tagged.
          TAG: v${{ needs.resolve-version.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          commit="$(gh api "repos/$REPO/commits/$TAG" --jq '.sha')"
          pr="$(gh api "repos/$REPO/commits/$commit/pulls" --jq '.[0].number // empty')"
          if [ -z "$pr" ]; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            echo "::notice::No pull request is associated with $TAG, so there is no build to publish."
            exit 0
          fi
          head="$(gh api "repos/$REPO/pulls/$pr" --jq '.head.sha')"
          # lint-test builds the release binaries; Staging only builds the image.
          run_id="$(gh api \
            "repos/$REPO/actions/workflows/lint-test.yml/runs?head_sha=$head&status=success&per_page=1" \
            --jq '.workflow_runs[0].id // empty')"
          if [ -z "$run_id" ]; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            echo "::notice::No successful lint-test run for pr-$pr, so there is nothing to publish."
            exit 0
          fi
          binaries="$(gh api "repos/$REPO/actions/runs/$run_id/artifacts?per_page=100" \
            --jq '[.artifacts[] | select(.name | startswith("openkite-dist-"))] | length')"
          if [ "$binaries" = '0' ]; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            echo "::notice::Run $run_id carries no openkite-dist artifacts: the pull request changed no build input."
            exit 0
          fi
          {
            echo "pr=$pr"
            echo "run_id=$run_id"
            echo "image=pr-${pr}-${head:0:7}"
          } >> "$GITHUB_OUTPUT"

  publish:
    name: Publish Release
    needs: [resolve-version, locate-build]
    if: needs.locate-build.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the release commit
        uses: actions/checkout@v7
        with:
          # gh release create --verify-tag reads the tag from a local clone.
          fetch-depth: 0
          fetch-tags: true
      - name: Download the binaries built for the pull request
        uses: actions/download-artifact@v8
        with:
          pattern: openkite-dist-*
          merge-multiple: true
          path: dist
          run-id: ${{ needs.locate-build.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Package the binaries
        shell: bash
        env:
          VERSION: v${{ needs.resolve-version.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p out
          for binary in dist/openkite-web-*; do
            name="$(basename "$binary")"
            platform="${name#openkite-web-}"
            platform="${platform%.exe}"
            platform="${platform//-/_}"
            tar -czf "out/openkite_${VERSION}_${platform}.tar.gz" -C dist "$name"
          done
          if [ -z "$(ls -A out 2>/dev/null)" ]; then
            echo "::error::The pull request run produced no binaries, so there is nothing to publish."
            exit 1
          fi
          (cd out && sha256sum ./*.tar.gz > checksums.txt)
          ls -lh out
      - name: Confirm the pull request image exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          source="ghcr.io/jomakori/openkite:${{ needs.locate-build.outputs.image }}"
          if ! docker buildx imagetools inspect "$source" >/dev/null 2>&1; then
            echo "::error::$source is missing: Staging never built an image for this pull request."
            exit 1
          fi
      - name: Create the release with generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${{ needs.resolve-version.outputs.version }}"
          gh release create "$tag" \
            --title "$tag" \
            --generate-notes \
            --verify-tag
      - name: Upload the release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="v${{ needs.resolve-version.outputs.version }}"
          gh release upload "$tag" out/* --clobber
      - name: Retag the pull request image as the release
        run: |
          set -euo pipefail
          source="ghcr.io/jomakori/openkite:${{ needs.locate-build.outputs.image }}"
          tag="ghcr.io/jomakori/openkite:v${{ needs.resolve-version.outputs.version }}"
          docker buildx imagetools create -t "$tag" -t ghcr.io/jomakori/openkite:latest "$source"
          docker buildx imagetools inspect "$tag"

  dispatch-packages:
    name: Dispatch Packages
    needs: [resolve-version, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Queue the Flatpak bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.resolve-version.outputs.version }}
        run: gh workflow run flatpak.yml --ref main -f tag="$TAG"
      - name: Queue the Chocolatey package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.resolve-version.outputs.version }}
        run: gh workflow run chocolatey.yml --ref main -f tag="$TAG"

  clean-up-artifacts:
    name: Clean Up Artifacts
    needs: [locate-build, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Delete the pull request artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ needs.locate-build.outputs.pr }}
        run: |
          set -euo pipefail
          head="$(gh api "repos/$REPO/pulls/$PR" --jq '.head.sha')"
          gh api "repos/$REPO/actions/runs?head_sha=$head&per_page=100" \
            --jq '.workflow_runs[].id' | while read -r run; do
              gh api "repos/$REPO/actions/runs/$run/artifacts" \
                --jq '.artifacts[] | select(.name | startswith("openkite-")) | .id' \
              | while read -r artifact; do
                  gh api -X DELETE "repos/$REPO/actions/artifacts/$artifact"
                  echo "deleted artifact $artifact from run $run"
                done
            done
