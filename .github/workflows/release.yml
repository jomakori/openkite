name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**.rs'
      - '**/Cargo.toml'
      - 'Cargo.lock'

permissions:
  contents: write
  issues: write
  pull-requests: write

# Serialize release runs: rapid consecutive merges race the checkout and
# semantic-release skips publishing ("local branch main is behind the remote"),
# producing missing/empty releases. Queued runs publish in order instead.
concurrency:
  group: openkite-release
  cancel-in-progress: false

jobs:
  analyze:
    name: Determine version
    runs-on: ubuntu-latest
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "semantic-release-bot"
          git config user.email "semantic-release-bot@users.noreply.github.com"
      - name: Run semantic-release (dry-run)
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
          dry_run: true
          extra_plugins: |
            @semantic-release/commit-analyzer
            @semantic-release/release-notes-generator
            @semantic-release/github
            semantic-release-cargo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-artifacts:
    name: openkite_${{ matrix.package_os }}_${{ matrix.package_arch }}
    needs: analyze
    if: needs.analyze.outputs.new_release_published == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            package_os: linux
            package_arch: amd64
            formats: appimage
            ext: AppImage
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            package_os: linux
            package_arch: arm64
            formats: appimage
            ext: AppImage
          - os: macos-26
            target: aarch64-apple-darwin
            package_os: macos
            package_arch: arm64
            formats: dmg
            ext: dmg
          - os: macos-26-intel
            target: x86_64-apple-darwin
            package_os: macos
            package_arch: amd64
            formats: dmg
            ext: dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            package_os: windows
            package_arch: amd64
            formats: nsis
            ext: exe
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            package_os: windows
            package_arch: arm64
            formats: nsis
            ext: exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
          key: ${{ matrix.target }}
      - name: Install Linux system deps (Dioxus desktop)
        if: matrix.package_os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libglib2.0-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            libssl-dev libfuse2
      - name: Install cargo-packager
        run: cargo install cargo-packager --locked
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package via cargo-packager (DMG / AppImage / MSI)
        shell: bash
        run: |
          cargo packager --release --target ${{ matrix.target }} \
            --formats ${{ matrix.formats }} --out-dir dist
      - name: Rename to openkite_<semver>_<os>_<arch>.<ext>
        shell: bash
        run: |
          version="${{ needs.analyze.outputs.new_release_version }}"
          artifact="$(find dist -maxdepth 1 -name '*.${{ matrix.ext }}' | head -1)"
          test -n "$artifact" || { echo "no .${{ matrix.ext }} artifact produced"; exit 1; }
          mv "$artifact" "dist/openkite_${version}_${{ matrix.package_os }}_${{ matrix.package_arch }}.${{ matrix.ext }}"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: openkite_${{ matrix.package_os }}_${{ matrix.package_arch }}
          path: dist/openkite_*_${{ matrix.package_os }}_${{ matrix.package_arch }}.${{ matrix.ext }}

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [analyze, build-artifacts]
    if: needs.analyze.outputs.new_release_published == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Check out the live tip of main, not the triggering commit: with
          # rapid consecutive merges the trigger commit can be behind origin/main
          # and semantic-release refuses to publish (empty release bodies).
          ref: main
      - name: Configure git
        run: |
          git config user.name "semantic-release-bot"
          git config user.email "semantic-release-bot@users.noreply.github.com"
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release (tag + notes)
        uses: cycjimmy/semantic-release-action@v4
        with:
          extra_plugins: |
            @semantic-release/commit-analyzer
            @semantic-release/release-notes-generator
            @semantic-release/github
            semantic-release-cargo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.analyze.outputs.new_release_version }}
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-tap:
    name: Update in-repo homebrew cask
    runs-on: ubuntu-latest
    needs: [analyze, publish]
    if: needs.analyze.outputs.new_release_published == 'true'
    steps:
      - name: Checkout openkite
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Download artifacts (dmgs + source tarball)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.analyze.outputs.new_release_version }}
        run: |
          mkdir -p /tmp/tap-artifacts
          for arch in arm64 amd64; do
            gh release download "v${VERSION}" \
              --repo jomakori/openkite \
              --pattern "openkite_${VERSION}_macos_${arch}.dmg" \
              --dir /tmp/tap-artifacts --clobber
          done
          curl -sL -o "/tmp/tap-artifacts/openkite-src.tar.gz" \
            "https://github.com/jomakori/openkite/archive/refs/tags/v${VERSION}.tar.gz"
      - name: Update cask (version + both arch sha256)
        env:
          VERSION: ${{ needs.analyze.outputs.new_release_version }}
        run: |
          set -euo pipefail
          ARM_SHA=$(shasum -a 256 /tmp/tap-artifacts/*_macos_arm64.dmg | awk '{print $1}')
          AMD_SHA=$(shasum -a 256 /tmp/tap-artifacts/*_macos_amd64.dmg | awk '{print $1}')
          CASK=Casks/openkite.rb
          sed -i "s/^  version .*/  version \"${VERSION}\"/" "$CASK"
          # on_arm block sha256
          awk -v sha="$ARM_SHA" '
            /on_arm do/ { in_arm=1 }
            in_arm && /sha256/ { sub(/sha256 ".*"/, "sha256 \"" sha "\""); in_arm=0 }
            { print }
          ' "$CASK" > "$CASK.tmp" && mv "$CASK.tmp" "$CASK"
          # on_intel block sha256
          awk -v sha="$AMD_SHA" '
            /on_intel do/ { in_intel=1 }
            in_intel && /sha256/ { sub(/sha256 ".*"/, "sha256 \"" sha "\""); in_intel=0 }
            { print }
          ' "$CASK" > "$CASK.tmp" && mv "$CASK.tmp" "$CASK"
          grep -q "version \"${VERSION}\"" "$CASK"
          grep -q "sha256 \"${ARM_SHA}\"" "$CASK"
          grep -q "sha256 \"${AMD_SHA}\"" "$CASK"
      - name: Update formula (version + sha256)
        env:
          VERSION: ${{ needs.analyze.outputs.new_release_version }}
        run: |
          set -euo pipefail
          SRC_SHA=$(shasum -a 256 /tmp/tap-artifacts/openkite-src.tar.gz | awk '{print $1}')
          FORMULA=Formula/openkite.rb
          sed -i "s|refs/tags/v[0-9.]*\.tar.gz|refs/tags/v${VERSION}.tar.gz|" "$FORMULA"
          sed -i "s/^  sha256 .*/  sha256 \"${SRC_SHA}\"/" "$FORMULA"
          grep -q "refs/tags/v${VERSION}.tar.gz" "$FORMULA"
          grep -q "sha256 \"${SRC_SHA}\"" "$FORMULA"
      - name: Commit + open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.analyze.outputs.new_release_version }}
        run: |
          git config user.name "semantic-release-bot"
          git config user.email "semantic-release-bot@users.noreply.github.com"
          git add Casks/openkite.rb Formula/openkite.rb
          if git diff --cached --quiet; then
            echo "brew files unchanged — nothing to push"
            exit 0
          fi
          git commit -m "chore(release): bump brew cask+formula to v${VERSION}"
          BRANCH="chore/brew-bump-v${VERSION}"
          git branch -m "$BRANCH"
          git push -u origin "$BRANCH"
          # open PR; if one exists for this bump, leave it
          PR_URL=$(gh pr view "$BRANCH" --repo jomakori/openkite --json url -q .url 2>/dev/null || true)
          if [ -z "$PR_URL" ]; then
            gh pr create --repo jomakori/openkite --base main --head "$BRANCH" \
              --title "chore(release): bump brew cask+formula to v${VERSION}" \
              --body "Auto-generated by the release workflow for v${VERSION}. Updates the Homebrew cask (arm64+amd64 DMG checksums) and Linux formula (source tarball checksum)."
          fi

  publish-choco:
    name: Publish chocolatey package (GH Packages)
    runs-on: windows-latest
    needs: [analyze, publish]
    if: needs.analyze.outputs.new_release_published == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Download Windows installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.analyze.outputs.new_release_version }}
        shell: pwsh
        run: |
          gh release download "v${env:VERSION}" --repo jomakori/openkite `
            --pattern "openkite_${env:VERSION}_windows_*.exe" --dir /tmp/choco-artifacts --clobber
          Get-ChildItem /tmp/choco-artifacts
      - name: Compute checksums + rewrite package
        env:
          VERSION: ${{ needs.analyze.outputs.new_release_version }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $amd = Get-FileHash (Get-ChildItem /tmp/choco-artifacts/*_windows_amd64.exe | Select-Object -First 1).FullName -Algorithm SHA256
          $arm = Get-FileHash (Get-ChildItem /tmp/choco-artifacts/*_windows_arm64.exe | Select-Object -First 1).FullName -Algorithm SHA256
          $ps1 = 'choco/tools/chocolateyinstall.ps1'
          (Get-Content $ps1 -Raw) `
            -replace "\`$version = '.*'", "\`$version = '$env:VERSION'" `
            -replace "\`$amd64Checksum = '.*'", "\`$amd64Checksum = '$($amd.Hash.ToLower())'" `
            -replace "\`$arm64Checksum = '.*'", "\`$arm64Checksum = '$($arm.Hash.ToLower())'" |
            Set-Content $ps1 -NoNewline
          $nuspec = 'choco/openkite.nuspec'
          (Get-Content $nuspec -Raw) -replace '<version>.*</version>', "<version>$env:VERSION</version>" |
            Set-Content $nuspec -NoNewline
      - name: choco pack + push to GitHub Packages
        env:
          VERSION: ${{ needs.analyze.outputs.new_release_version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          choco pack choco/openkite.nuspec --outputdirectory /tmp/choco-artifacts
          choco push "/tmp/choco-artifacts/openkite.$env:VERSION.nupkg" `
            --source "https://nuget.pkg.github.com/jomakori/index.json" `
            --api-key $env:GH_TOKEN
