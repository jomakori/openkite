name: pr-artifacts-cleanup

# The cluster half of a preview teardown is the gke_GitOps ApplicationSet's job;
# the registry half is this workflow. GitHub's package retention rules are
# organisation-only, so a user-owned package has no backstop to configure - the
# weekly sweep is that backstop.
on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR number to prune (empty = sweep every closed PR)'
        required: false
        default: ''
        type: string
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read
  packages: write
  pull-requests: read

concurrency:
  group: pr-artifacts-cleanup
  cancel-in-progress: false

env:
  OWNER: jomakori
  PACKAGE: openkite
  REPO: jomakori/openkite

jobs:
  prune:
    name: Prune preview artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete the image versions this PR published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ github.event.pull_request.number }}" ]; then
            ./scripts/prune-pr-image.sh "${{ github.event.pull_request.number }}"
          elif [ -n "${{ inputs.pr }}" ]; then
            ./scripts/prune-pr-image.sh "${{ inputs.pr }}"
          else
            ./scripts/prune-pr-image.sh --sweep
          fi
