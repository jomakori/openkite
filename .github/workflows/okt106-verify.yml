# TEMP verify OKT-106 (do not keep)
#
# DISPOSABLE. Exercises the OKT-106 fail-safe against the production scripts
# without publishing anything:
#
#   case=refuse         incomplete artifact set -> the publish preflight FAILS
#   case=accept         complete six-target set -> preflight passes
#   case=subset         two-target set + explicit targets input -> passes (pruned)
#   case=subset-refuse  two-target set, no input -> FAILS (default is strict)
#   case=tracker        report-main-failure.sh for a real failed main run
#
# TRIGGER NOTE: GitHub will not dispatch a workflow whose file is absent from
# the default branch until it has run once. The branch-scoped push trigger is a
# one-shot registration shim; all real work is gated to workflow_dispatch.
#
# DELETE THIS FILE before the PR is ready for review.

name: TEMP verify OKT-106 (do not keep)

on:
  workflow_dispatch:
    inputs:
      case:
        description: 'refuse | accept | subset | subset-refuse | tracker'
        required: true
        type: choice
        options:
          - refuse
          - accept
          - subset
          - subset-refuse
          - tracker
      run_id:
        description: 'run id for case=tracker'
        required: false
        default: ''
        type: string
      workflow_name:
        description: 'workflow name for case=tracker'
        required: false
        default: ''
        type: string
  push:
    branches:
      - ci/okt106-release-failsafe

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  register:
    name: Register workflow (no-op)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Register only
        run: echo "branch-scoped push only registers this workflow for dispatch"

  preflight:
    name: Preflight (${{ inputs.case }})
    if: github.event_name == 'workflow_dispatch' && inputs.case != 'tracker'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build the synthetic dist
        env:
          CASE: ${{ inputs.case }}
        run: |
          set -euo pipefail
          dist="$RUNNER_TEMP/dist"
          rm -rf "$dist"; mkdir -p "$dist"
          all=(linux_amd64.AppImage linux_arm64.AppImage macos_amd64.dmg \
               macos_arm64.dmg windows_amd64.exe windows_arm64.exe)
          case "$CASE" in
            accept)
              for a in "${all[@]}"; do touch "$dist/openkite_0.0.0_$a"; done ;;
            refuse)
              for a in "${all[@]}"; do touch "$dist/openkite_0.0.0_$a"; done
              rm -f "$dist/openkite_0.0.0_macos_arm64.dmg" ;;
            subset | subset-refuse)
              touch "$dist/openkite_0.0.0_linux_amd64.AppImage" \
                    "$dist/openkite_0.0.0_macos_arm64.dmg" ;;
          esac
          ls -1 "$dist"
      - name: Run the production preflight exactly as Publish release does
        env:
          CASE: ${{ inputs.case }}
        run: |
          set -euo pipefail
          dist="$RUNNER_TEMP/dist"
          case "$CASE" in
            subset)
              bash .github/scripts/normalize-release-assets.sh "$dist" 9.9.9 "linux_amd64,macos_arm64" ;;
            *)
              bash .github/scripts/normalize-release-assets.sh "$dist" 9.9.9 ;;
          esac

  tracker:
    name: Tracker (create or update)
    if: github.event_name == 'workflow_dispatch' && inputs.case == 'tracker'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Report the failure through the production script
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ inputs.run_id }}
          WORKFLOW_NAME: ${{ inputs.workflow_name }}
        run: bash .github/scripts/report-main-failure.sh
