name: preview

on:
  pull_request:
    types: [labeled, unlabeled, closed]

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy the preview environment
    if: >-
      github.event.action == 'labeled' &&
      github.event.label.name == 'preview'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      TILT_VERSION: v0.37.7
      OPENKITE_PR: ${{ github.event.pull_request.number }}
      OPENKITE_DEV_LOOP: '0'
      OPENKITE_CHART: gke_GitOps/apps/helm
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Check out the chart
        uses: actions/checkout@v4
        with:
          repository: jomakori/gke_GitOps
          path: gke_GitOps
      - name: Install Tilt
        run: |
          curl -fsSL "https://github.com/tilt-dev/tilt/releases/download/${TILT_VERSION}/tilt.${TILT_VERSION#v}.linux.x86_64.tar.gz" \
            | tar -xz -C /usr/local/bin tilt
          tilt version
      - name: Join the tailnet
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
      - name: Write the client kubeconfig
        run: |
          tailscale configure kubeconfig ${{ secrets.TAILSCALE_PROXY_HOST }}
          kubectl config current-context
          echo "OPENKITE_CONTEXT=$(kubectl config current-context)" >> "$GITHUB_ENV"
      - name: Assert cluster access
        run: kubectl auth can-i list namespaces
      - name: Build the console bundle
        run: bash web/build.sh
      - name: Deploy the preview
        run: tilt ci

  withdraw:
    name: Withdraw the preview label
    needs: [deploy]
    if: >-
      failure() &&
      github.event.label.name == 'preview'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Withdraw the preview label when the deploy failed
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request.number;
            try {
              await github.rest.issues.removeLabel({ owner, repo, issue_number: pr, name: 'preview' });
              core.notice(`pr-${pr}: the deploy failed, so the label came off.`);
            } catch (error) {
              if (error.status === 404) {
                core.notice(`pr-${pr}: no preview label to withdraw.`);
                return;
              }
              throw error;
            }

  teardown:
    name: Remove the preview environment
    if: >-
      (github.event.action == 'unlabeled' && github.event.label.name == 'preview') ||
      github.event.action == 'closed'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      RELEASE: openkite-preview-${{ github.event.pull_request.number }}
      ENVIRONMENT: openkite-pr${{ github.event.pull_request.number }}
    steps:
      - name: Join the tailnet
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
      - name: Write the client kubeconfig
        run: |
          tailscale configure kubeconfig ${{ secrets.TAILSCALE_PROXY_HOST }}
          kubectl config current-context
      - name: Assert cluster access
        run: kubectl auth can-i list namespaces
      - name: Remove the environment
        run: |
          helm uninstall "$RELEASE" --namespace "$ENVIRONMENT" --ignore-not-found
          kubectl delete namespace "$ENVIRONMENT" --ignore-not-found

  staging:
    name: Build the staging image
    if: >-
      contains(github.event.pull_request.labels.*.name, 'staging') &&
      github.event.action != 'closed'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    concurrency:
      group: staging-image-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build and publish pr-<N> with its sha pin
        uses: ./.github/actions/build-image
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          tag: pr-${{ github.event.pull_request.number }}
          pin-sha-tag: 'true'
          host: staging-openkite.maklab.net

  withdraw-staging:
    name: Withdraw the staging label when the image failed
    needs: [staging]
    if: >-
      always() &&
      contains(github.event.pull_request.labels.*.name, 'staging') &&
      (needs.staging.result == 'failure' || needs.staging.result == 'timed_out')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Remove the staging label
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request.number;
            try {
              await github.rest.issues.removeLabel({ owner, repo, issue_number: pr, name: 'staging' });
              core.notice(`pr-${pr}: no staging image was published - withdrew the staging label.`);
            } catch (error) {
              if (error.status !== 404) throw error;
            }

  prune:
    name: Delete the images this PR published
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      pull-requests: read
    concurrency:
      group: preview-prune-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Prune the image versions this PR published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event.pull_request.merged }}" = "true" ]; then
            ./.github/scripts/prune-pr-image.sh --merged "${{ github.event.pull_request.number }}"
          else
            ./.github/scripts/prune-pr-image.sh "${{ github.event.pull_request.number }}"
          fi
