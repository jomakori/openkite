name: preview

on:
  pull_request:
    types: [labeled, synchronize, reopened, closed]

permissions:
  contents: read

jobs:
  image:
    name: Build the preview image
    if: >-
      contains(github.event.pull_request.labels.*.name, 'preview') &&
      github.event.action != 'closed'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    concurrency:
      group: preview-image-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Build and publish pr-<N> with its sha pin
        uses: ./.github/actions/build-image
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          tag: pr-${{ github.event.pull_request.number }}
          pin-sha-tag: 'true'
          host: pr${{ github.event.pull_request.number }}.maklab.net

  ready:
    name: Confirm the preview image is published
    needs: [image]
    if: >-
      !cancelled() &&
      contains(github.event.pull_request.labels.*.name, 'preview') &&
      github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Withdraw the preview label when the image failed
        uses: actions/github-script@v7
        env:
          IMAGE_RESULT: ${{ needs.image.result }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request.number;
            if (process.env.IMAGE_RESULT === 'success') {
              core.notice(`pr-${pr}: image published, so the preview label keeps the ApplicationSet deploying it.`);
              return;
            }
            const why = process.env.IMAGE_RESULT;
            try {
              await github.rest.issues.removeLabel({
                owner,
                repo,
                issue_number: pr,
                name: 'preview',
              });
              core.notice(`pr-${pr}: no image was published (image job: ${why}) - withdrew the preview label.`);
            } catch (error) {
              if (error.status === 404) {
                core.notice(`pr-${pr}: no preview label to withdraw.`);
                return;
              }
              throw error;
            }

  prune:
    name: Delete the preview images this PR left behind
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      pull-requests: read
    concurrency:
      group: preview-prune-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Prune the image versions this PR published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event.pull_request.merged }}" = "true" ]; then
            ./scripts/prune-pr-image.sh --merged "${{ github.event.pull_request.number }}"
          else
            ./scripts/prune-pr-image.sh "${{ github.event.pull_request.number }}"
          fi

  report:
    name: Track the main-branch outcome
    needs: [image, ready, prune]
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      actions: read
    concurrency:
      group: ci-failure-${{ github.workflow }}
      cancel-in-progress: false
    steps:
      - name: Open, update, or close the tracking issue
        uses: ./.github/actions/notify-failure
        with:
          run-id: ${{ github.run_id }}
          workflow-name: ${{ github.workflow }}
          failed: ${{ contains(needs.*.result, 'failure') }}
          cancelled: ${{ contains(needs.*.result, 'cancelled') }}
