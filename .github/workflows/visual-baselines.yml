name: Visual baselines (browser host)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    name: Capture browser-host baselines
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Must track the wasm-bindgen entry pinned in Cargo.lock (and the
      # version the Dockerfile's wasm-bindgen stage curls) — a mismatched
      # CLI/crate version pair fails the bundle with a schema-version error.
      WASM_BINDGEN_VERSION: 0.2.127
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install the toolchain
        uses: ./.github/actions/rust-setup
        with:
          targets: wasm32-unknown-unknown
          profile: none
          cache-key: visual-browser
      - name: Build the openkite-web host binary
        run: cargo build -p openkite-web --locked
      - name: Build the wasm hydration client
        run: |
          cargo build --release -p openkite-web --bin openkite-web-client \
            --target wasm32-unknown-unknown --features hydrate --locked
      - name: Install the pinned wasm-bindgen CLI
        run: |
          set -euo pipefail
          tarball="wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl"
          base="https://github.com/rustwasm/wasm-bindgen/releases/download"
          curl -fsSL "${base}/${WASM_BINDGEN_VERSION}/${tarball}.tar.gz" \
            | tar -xz -C /usr/local/bin --strip-components=1 "${tarball}/wasm-bindgen"
      - name: Produce the hydration bundle (wasm-bindgen output)
        run: |
          mkdir -p "$RUNNER_TEMP/web-bundle"
          wasm-bindgen \
            --target web \
            --no-typescript \
            --out-dir "$RUNNER_TEMP/web-bundle" \
            target/wasm32-unknown-unknown/release/openkite-web-client.wasm
      - name: Capture the baselines
        working-directory: e2e
        env:
          OPENKITE_WEB_BIN: ${{ github.workspace }}/target/debug/openkite-web
          OPENKITE_WEB_ROOT: ${{ runner.temp }}/web-bundle
        run: node visual/browser/capture.mjs visual/browser/baselines
      - name: Report which baselines moved
        run: |
          git status --porcelain -- e2e/visual/browser/baselines
          git diff --stat -- e2e/visual/browser/baselines
      - name: Upload the captured baselines
        uses: actions/upload-artifact@v4
        with:
          name: browser-baselines
          path: e2e/visual/browser/baselines/
          retention-days: 7
