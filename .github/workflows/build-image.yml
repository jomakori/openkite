name: Build image

# The one definition of "publish an openkite image". Two callers, one build:
#
#   pr-image.yml  → tag `pr-<N>`   + `pr-<N>-<sha>`  (the preview ApplicationSet
#                                    consumes `pr-<N>` by name, so that exact tag
#                                    must be what this pushes)
#   release.yml   → tag `v<X.Y.Z>` + `v<X.Y.Z>-<sha>` (prod pins `v<X.Y.Z>`; the
#                                    pin-bump workflow in gke_GitOps rewrites the
#                                    pin to that same string on every release)
#
# Before this existed each caller carried its own copy of the web-bundle +
# `docker build` + GHCR login steps: the same contract written twice, where drift
# means a tag nothing consumes. Callers keep what is genuinely theirs — when to
# build, how to tag, what to do with the result (labels, releases) — and this
# workflow owns how the image is produced.

on:
  workflow_call:
    inputs:
      ref:
        description: >-
          Git ref to build. Empty builds the triggering commit, which is what a PR
          wants; a release passes the commit its tag points at.
        required: false
        default: ""
        type: string
      tag:
        description: >-
          Mutable image tag to publish, without the registry prefix: `pr-<N>` for a
          preview, `v<X.Y.Z>` for a release. This is the reference consumers resolve
          by name.
        required: true
        type: string
      pin_sha_tag:
        description: >-
          Also publish `<tag>-<short sha>` as an immutable pin that traces the image
          back to its commit. On for PRs (previews pin this way), off for releases
          where the git tag is already immutable.
        required: false
        default: false
        type: boolean
      host:
        description: >-
          Host that serves this image, for the run summary only (e.g.
          pr<N>.maklab.net). Optional — the summary omits the row when empty.
        required: false
        default: ""
        type: string

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build and push image
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The image serves the browser bundle. It is REQUIRED, not best-effort: a
      # missing bundle used to be reported as `ready=false` with the build and push
      # steps skipped, so the job finished GREEN having pushed nothing —
      # indistinguishable, from the PR, from a PR that published an image. No
      # bundle → no image → no `preview` label → no preview, and a red check
      # instead of a silent ImagePullBackOff.
      - name: Build web bundle
        run: |
          set -euo pipefail
          if [ ! -x web/build.sh ]; then
            echo "::error title=No web bundle script::web/build.sh is missing or not executable, so no bundle can be produced and no image published. See web/README.md."
            exit 1
          fi
          ./web/build.sh
          if [ ! -f web/dist/index.html ]; then
            echo "::error title=Web build produced no bundle::web/build.sh ran but web/dist/index.html is missing. See web/README.md."
            exit 1
          fi

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build image
        env:
          TAG: ${{ inputs.tag }}
          PIN_SHA_TAG: ${{ inputs.pin_sha_tag }}
        run: |
          set -euo pipefail
          # The tag becomes a reference consumers resolve by name and, for a
          # release, the value prod pins. Reject anything that is not a legal
          # image tag here rather than publishing a reference nothing can pull.
          if ! [[ "$TAG" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error title=Unusable image tag::'${TAG}' is not a legal Docker tag (allowed: letters, digits, dot, underscore, dash)."
            exit 1
          fi
          image="ghcr.io/jomakori/openkite"
          tags=(--tag "${image}:${TAG}")
          if [ "$PIN_SHA_TAG" = "true" ]; then
            short_sha="$(git rev-parse --short=7 HEAD)"
            tags+=(--tag "${image}:${TAG}-${short_sha}")
          fi
          echo "Tags: ${tags[*]}"
          docker build "${tags[@]}" .
          {
            echo "IMAGE=${image}"
            echo "TAG=${TAG}"
          } >> "$GITHUB_ENV"

      - name: Push image
        run: |
          set -euo pipefail
          docker push --all-tags "${IMAGE}"
          docker image ls "${IMAGE}" --format '  pushed {{.Tag}}'

      - name: Record the published reference
        env:
          HOST: ${{ inputs.host }}
          PIN_SHA_TAG: ${{ inputs.pin_sha_tag }}
        run: |
          set -euo pipefail
          {
            echo "### Image published"
            echo ""
            echo "| item | reference |"
            echo "|---|---|"
            echo "| image | \`${IMAGE}:${TAG}\` |"
            if [ "$PIN_SHA_TAG" = "true" ]; then
              echo "| pinned to this commit | \`${IMAGE}:${TAG}-$(git rev-parse --short=7 HEAD)\` |"
            fi
            echo "| built from | \`$(git rev-parse HEAD)\` |"
            if [ -n "$HOST" ]; then
              echo "| served at | \`https://${HOST}\` |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
