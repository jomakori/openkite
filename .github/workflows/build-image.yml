name: Build image

# The one definition of "publish an openkite image". Two callers, one build:
#
#   pr-image.yml  → tag `pr-<N>`   + `pr-<N>-<sha>`  (the preview ApplicationSet
#                                    consumes `pr-<N>` by name, so that exact tag
#                                    must be what this pushes)
#   release.yml   → tag `v<X.Y.Z>` + `v<X.Y.Z>-<sha>` (prod pins `v<X.Y.Z>`; the
#                                    pin-bump workflow in gke_GitOps rewrites the
#                                    pin to that same string on every release)
#
# One build, one order: the web bundle and the console host are compiled, the
# image is built, the image is smoke-tested, and only then is anything pushed.
#
# Before this existed each caller carried its own copy of the bundle +
# `docker build` + GHCR login steps: the same contract written twice, where drift
# means a tag nothing consumes. Callers keep what is genuinely theirs — when to
# build, how to tag, what to do with the result (labels, releases) — and this
# workflow owns how the image is produced.

on:
  workflow_call:
    inputs:
      ref:
        description: >-
          Git ref to build. Empty builds the triggering commit, which is what a PR
          wants; a release passes the commit its tag points at.
        required: false
        default: ""
        type: string
      tag:
        description: >-
          Mutable image tag to publish, without the registry prefix: `pr-<N>` for a
          preview, `v<X.Y.Z>` for a release. This is the reference consumers resolve
          by name.
        required: true
        type: string
      pin_sha_tag:
        description: >-
          Also publish `<tag>-<short sha>` as an immutable pin that traces the image
          back to its commit. On for PRs (previews pin this way), off for releases
          where the git tag is already immutable.
        required: false
        default: false
        type: boolean
      host:
        description: >-
          Host that serves this image, for the run summary only (e.g.
          pr<N>-openkite.maklab.net). Optional — the summary omits the row when
          empty.
        required: false
        default: ""
        type: string

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build and push image
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The image serves the browser bundle. It is REQUIRED, not best-effort: a
      # missing bundle used to be reported as `ready=false` with the build and push
      # steps skipped, so the job finished GREEN having pushed nothing —
      # indistinguishable, from the PR, from a PR that published an image. No
      # bundle → no image → no `preview` label → no preview, and a red check
      # instead of a silent ImagePullBackOff.
      - name: Build web bundle
        run: |
          set -euo pipefail
          if [ ! -x web/build.sh ]; then
            echo "::error title=No web bundle script::web/build.sh is missing or not executable, so no bundle can be produced and no image published. See web/README.md."
            exit 1
          fi
          ./web/build.sh
          if [ ! -f web/dist/index.html ]; then
            echo "::error title=Web build produced no bundle::web/build.sh ran but web/dist/index.html is missing. See web/README.md."
            exit 1
          fi

      # The image's runtime is the Rust host, so the host is compiled here and
      # COPYed in — the Dockerfile deliberately does not build Rust (see its
      # runtime stage). `-p openkite-web` only: that crate depends on `openkite`
      # with `default-features = false`, so the `desktop` feature's wry/WebKit
      # renderer is not in the graph and this needs no GTK apt packages and no
      # `.github/actions/rust-setup`.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Its own key: the caches elsewhere warm `target/debug`, which a release
      # build cannot use. Only default-branch caches are restorable from another
      # branch and this workflow never runs on `main`, so PR runs restore and
      # save nothing — `lint-test.yml`'s `image-build-cache` writes it on `main`.
      - name: Cache the Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: openkite-web-image
          cache-targets: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build the console host
        run: |
          set -euo pipefail
          cargo build --release -p openkite-web
          test -f target/release/openkite-web || {
            echo "::error title=No console host binary::cargo build produced no target/release/openkite-web, which the runtime stage COPYs. Refusing to build an image with no host."
            exit 1
          }

      - name: Build image
        env:
          TAG: ${{ inputs.tag }}
          PIN_SHA_TAG: ${{ inputs.pin_sha_tag }}
        run: |
          set -euo pipefail
          # The tag becomes a reference consumers resolve by name and, for a
          # release, the value prod pins. Reject anything that is not a legal
          # image tag here rather than publishing a reference nothing can pull.
          if ! [[ "$TAG" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error title=Unusable image tag::'${TAG}' is not a legal Docker tag (allowed: letters, digits, dot, underscore, dash)."
            exit 1
          fi
          image="ghcr.io/jomakori/openkite"
          tags=(--tag "${image}:${TAG}")
          if [ "$PIN_SHA_TAG" = "true" ]; then
            short_sha="$(git rev-parse --short=7 HEAD)"
            tags+=(--tag "${image}:${TAG}-${short_sha}")
          fi
          echo "Tags: ${tags[*]}"
          docker build "${tags[@]}" .
          {
            echo "IMAGE=${image}"
            echo "TAG=${TAG}"
          } >> "$GITHUB_ENV"

      # The host exits without a cluster, so it gets a stub kubeconfig:
      # `Client::try_default` parses it and never touches the network, leaving the
      # reflectors to retry in the background (`drive_reflector` logs and
      # continues). Runs before the push, and is what proves the binary loads on
      # this base, the bundle sits where OPENKITE_WEB_ROOT says, uid 65532 can bind
      # 8080, and the SPA fallback and bridge route answer.
      - name: Smoke-test the image
        run: |
          set -euo pipefail
          stub="$RUNNER_TEMP/stub"
          mkdir -p "$stub"
          # One line, so the YAML block's indentation cannot leak into the file.
          # kubeconfig is YAML, and YAML is a JSON superset.
          printf '%s' '{"apiVersion":"v1","kind":"Config","clusters":[{"name":"stub","cluster":{"server":"https://127.0.0.1:1"}}],"contexts":[{"name":"stub","context":{"cluster":"stub","user":"stub"}}],"current-context":"stub","users":[{"name":"stub","user":{}}]}' > "$stub/kubeconfig"
          chmod 0644 "$stub/kubeconfig"

          docker run -d --name openkite-smoke \
            -p 18080:8080 \
            -e KUBECONFIG=/stub/kubeconfig \
            -v "$stub/kubeconfig:/stub/kubeconfig:ro" \
            "${IMAGE}:${TAG}"

          served=0
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:18080/; then served=1; break; fi
            # A host that died on a boot failure never answers: stop waiting.
            if [ "$(docker inspect --format '{{.State.Running}}' openkite-smoke)" != "true" ]; then
              break
            fi
            sleep 1
          done
          if [ "$served" != 1 ]; then
            echo "::error title=Image never answered::no HTTP 200 from :8080 (container exit code $(docker inspect --format '{{.State.ExitCode}}' openkite-smoke))"
            docker logs openkite-smoke || true
            exit 1
          fi

          # The image serves the bundle it was built with, byte for byte.
          curl -fsS http://127.0.0.1:18080/ -o "$RUNNER_TEMP/served.html"
          cmp "$RUNNER_TEMP/served.html" web/dist/index.html

          # SPA fallback: a client-side route answers the shell, not a 404.
          curl -fsS http://127.0.0.1:18080/cluster | cmp - web/dist/index.html

          # The bridge route is mounted and answers the console's envelope. The
          # stub API server is unreachable, so the payload is an `error`
          # envelope — that is the point: HTTP 200 plus a shaped body, never a
          # bare status the console would read as "no host here".
          code=$(curl -sS -o "$RUNNER_TEMP/bridge.json" -w '%{http_code}' \
            -H 'content-type: application/json' \
            -d '{"id":1,"plugin":"console","request":{"op":"list","kind":"pods","ns":null}}' \
            http://127.0.0.1:18080/openkite)
          test "$code" = "200"
          grep -q '"status":"error"' "$RUNNER_TEMP/bridge.json"

          # Non-root, at the uid the chart's absent securityContext leaves to us.
          test "$(docker inspect --format '{{.Config.User}}' openkite-smoke)" = "65532:65532"
          host_uid=$(ps -o uid= -p "$(docker inspect --format '{{.State.Pid}}' openkite-smoke)" | tr -d ' ')
          test "$host_uid" = "65532"

          # The boot log names the listener and the bundle root it serves. Strip
          # ANSI first: `tracing` writes escape codes between a field name and its
          # value, so the plain text the reader expects is not a substring.
          docker logs openkite-smoke 2>&1 | sed 's/\x1b\[[0-9;]*m//g' | tee "$RUNNER_TEMP/openkite-smoke.log"
          grep -q 'openkite-web listening' "$RUNNER_TEMP/openkite-smoke.log"
          grep -q 'web_root=/app/web/dist' "$RUNNER_TEMP/openkite-smoke.log"

          docker rm -f openkite-smoke
          {
            echo "### Image smoke test"
            echo ""
            echo "| check | result |"
            echo "|---|---|"
            echo "| \`GET /\` == the built \`web/dist/index.html\` | pass |"
            echo "| \`GET /cluster\` == the shell (SPA fallback) | pass |"
            echo "| \`POST /openkite\` == HTTP 200 + envelope | pass |"
            echo "| uid / port | 65532:65532 / 8080 | pass |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push image
        run: |
          set -euo pipefail
          docker push --all-tags "${IMAGE}"
          docker image ls "${IMAGE}" --format '  pushed {{.Tag}}'

      - name: Record the published reference
        env:
          HOST: ${{ inputs.host }}
          PIN_SHA_TAG: ${{ inputs.pin_sha_tag }}
        run: |
          set -euo pipefail
          {
            echo "### Image published"
            echo ""
            echo "| item | reference |"
            echo "|---|---|"
            echo "| image | \`${IMAGE}:${TAG}\` |"
            if [ "$PIN_SHA_TAG" = "true" ]; then
              echo "| pinned to this commit | \`${IMAGE}:${TAG}-$(git rev-parse --short=7 HEAD)\` |"
            fi
            echo "| built from | \`$(git rev-parse HEAD)\` |"
            if [ -n "$HOST" ]; then
              echo "| served at | \`https://${HOST}\` |"
            fi
            echo "| size on disk | \`$(docker image ls "${IMAGE}:${TAG}" --format '{{.Size}}')\` |"
          } >> "$GITHUB_STEP_SUMMARY"
