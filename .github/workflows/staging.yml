name: Staging

# One build per pull request, versioned pr-<number>, so release can promote the
# image instead of rebuilding it. Applying the `staging` label additionally hands
# the per-commit tag to the staging ApplicationSet, which is what runs the env.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

concurrency:
  group: staging-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  version:
    name: Resolve Version
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      token: ${{ steps.token.outputs.token }}
      sha7: ${{ steps.token.outputs.sha7 }}
    steps:
      - name: RESOLVE token and short sha
        id: token
        env:
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "token=pr-${PR}" >> "$GITHUB_OUTPUT"
          echo "sha7=${HEAD_SHA:0:7}" >> "$GITHUB_OUTPUT"

  image:
    name: Build Image
    needs: [version]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: CHECK OUT the pull request head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: LOG IN to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: SET UP buildx
        uses: docker/setup-buildx-action@v3
      - name: BUILD and push the PR image tags
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            OPENKITE_VERSION=${{ needs.version.outputs.token }}
          # Both tags carry weight: the constant one names the artifact, the
          # sha-tagged one is what makes the ApplicationSet roll on a new push.
          tags: |
            ghcr.io/jomakori/openkite:${{ needs.version.outputs.token }}
            ghcr.io/jomakori/openkite:${{ needs.version.outputs.token }}-${{ needs.version.outputs.sha7 }}
