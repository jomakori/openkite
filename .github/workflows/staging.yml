name: Staging

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain*'
      - 'Dockerfile'
      - 'build.rs'
      - '.github/workflows/staging.yml'
  workflow_dispatch:

concurrency:
  group: staging-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  resolve-version:
    name: Resolve Version
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      token: ${{ steps.resolve.outputs.token }}
      sha7: ${{ steps.resolve.outputs.sha7 }}
    steps:
      - name: Resolve the token and short sha
        id: resolve
        env:
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "token=pr-${PR}" >> "$GITHUB_OUTPUT"
          echo "sha7=${HEAD_SHA:0:7}" >> "$GITHUB_OUTPUT"

  build-image:
    name: Build Image
    needs: [resolve-version]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      IMAGE_TAG: ${{ needs.resolve-version.outputs.token }}
      IMAGE_SHA_TAG: ${{ needs.resolve-version.outputs.token }}-${{ needs.resolve-version.outputs.sha7 }}
    steps:
      - name: Check out the pull request head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Log in to ghcr
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push the pull request tags
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            OPENKITE_VERSION=${{ needs.resolve-version.outputs.token }}
          tags: |
            ghcr.io/jomakori/openkite:${{ env.IMAGE_TAG }}
            ghcr.io/jomakori/openkite:${{ env.IMAGE_SHA_TAG }}
