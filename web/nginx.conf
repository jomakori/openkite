# Static preview server for the OpenKite web bundle.
#
# Unknown paths fall back to index.html so client-side routes (the app
# router, e.g. /workloads) survive a hard refresh on a PR preview host.
#
# Listens on 8080, not 80: the image is nginx-unprivileged (uid 101), which
# cannot bind a privileged port. 8080 also matches the openkite-preview
# chart's service.targetPort.
server {
    listen       8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
