repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt --all -- --check
        entry: cargo fmt --all -- --check
        language: system
        pass_filenames: false
        types: [rust]

      - id: cargo-check-engine
        name: cargo check -p openkite-engine
        entry: cargo check -p openkite-engine --all-targets
        language: system
        pass_filenames: false
        types: [rust]

      - id: cargo-clippy-engine
        name: cargo clippy -p openkite-engine
        entry: cargo clippy -p openkite-engine --all-targets -- -D warnings
        language: system
        pass_filenames: false
        types: [rust]

      - id: comment-hygiene
        name: comments carry no ids or narration
        entry: bash scripts/check-comments.sh
        language: system
        files: '\.(rs|toml|ya?ml|css|js|mjs|ts|py|sh)$'
        # allow: console.css is generated; the reference sheets mirror it byte-for-byte
        exclude: '^(crates/openkite-ui/assets/console\.css|docs/reference/opendesign-console/[^/]+\.css)$'
