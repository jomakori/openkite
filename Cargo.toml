[workspace]
members = [".", "crates/*"]
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[package]
name = "openkite"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "OpenKite — Kubernetes from above. Pure Rust K8s IDE (Dioxus 0.7 + kube-rs)."

[dependencies]
dioxus = { version = "0.7", features = ["desktop", "router"] }
openkite-plugin-sdk = { path = "crates/plugin-sdk" }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "5"
anyhow = "1"
futures = "0.3"

# Binary crate: select the Kubernetes version here (k8s-openapi "latest").
k8s-openapi = { version = "0.28", features = ["latest"] }
# kube-rs (OKT-6): default features bring client + rustls-tls + ring (crypto
# provider auto-installed). Extras: runtime/derive (reflectors), oidc (token
# refresh), ws (log_stream/attach).
kube = { version = "4", features = ["runtime", "derive", "oidc", "ws", "rustls-tls"] }

[dev-dependencies]
http = "1"
kube = { version = "4", default-features = false, features = ["client"] }
rustls = { version = "0.23", features = ["ring"] }

[package.metadata.packager]
name = "openkite"
product-name = "OpenKite"
identifier = "com.openkite.app"
icons = ["icons/icon.icns", "icons/icon.ico", "icons/icon.png"]
binaries = [{ path = "openkite", main = true }]

# AppImage: bundle webkit runtime + gtk plugin. Unsandboxed → full host access
# (kubeconfig, CLIs, scripts). FUSE-less: APPIMAGE_EXTRACT_AND_RUN=1
[package.metadata.packager.appimage]
libs = [
  "WebKitNetworkProcess",
  "WebKitWebProcess",
  "libwebkit2gtkinjectedbundle.so",
]
linuxdeploy-plugins = { gtk = "https://raw.githubusercontent.com/tauri-apps/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh" }

# NOTE: panic stays "unwind" — plugin containment needs catch_unwind
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
