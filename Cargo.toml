# Workspace manifest only — every crate lives in crates/. The desktop app is
# crates/openkite-desktop, the browser host is crates/openkite-web, and the UI they
# share is extracted into crates/openkite-ui (see .hermes/plans/openkite-shared-ui-crate.md).
[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"


# Profiles live here: Cargo ignores [profile.*] in workspace members.
# NOTE: panic stays "unwind" — plugin containment needs catch_unwind
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
