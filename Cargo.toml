# Workspace manifest only; every crate lives in crates/.
[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.90"

# Exact pins: an upstream minor move is a deliberate commit, not a silent drift.
[workspace.dependencies]
axum = "=0.8.9"
dioxus = "=0.7.10"
http-body-util = "=0.1.5"
kube = { version = "=5.0.0", features = ["client", "runtime", "derive", "oidc", "ws", "rustls-tls"] }
k8s-openapi = { version = "=0.29.0", features = ["latest"] }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tower = { version = "=0.5.3", features = ["util"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }

# Profiles live here: Cargo ignores [profile.*] in workspace members.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
