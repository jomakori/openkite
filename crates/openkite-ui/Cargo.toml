[package]
name = "openkite-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "OpenKite shared UI — the console components, design system and shell chrome both hosts render."

[features]
default = []
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]

[dependencies]
dioxus = "0.7"
openkite-api = { path = "../openkite-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
opaline = { version = "0.4", default-features = false, features = ["builtin-themes"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["time"] }
base64 = "0.22"

[dev-dependencies]
dioxus-ssr = "0.7"
dioxus-signals = "0.7"
dioxus-core = "0.7"
base64 = "0.22"
