[package]
name = "openkite-ui"
description = "Dioxus console rendered by both the desktop and the web shell"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
rust-version.workspace = true

[dependencies]
dioxus.workspace = true
openkite-api = { path = "../openkite-api", version = "0.1.0" }

[features]
default = []
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
