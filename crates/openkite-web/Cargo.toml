[package]
name = "openkite-web"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "OpenKite web host — serves the console bundle and answers its kube bridge over HTTP."

[dependencies]
# The core without the native renderer: this crate is the host-less target the
# `desktop` feature exists to allow, so the browser host carries no WebKit/GTK.
openkite = { path = "../..", default-features = false }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "io-util"] }
# Static file service for the console bundle (SPA fallback included).
tower-http = { version = "0.6", features = ["fs"] }
kube = "4"
# The reflector set owns Dioxus signals, so the host supplies the runtime that
# owns them (`src/headless.rs`). `dioxus-core` is already in the graph through
# the core crate; only its runtime types are used here, never the renderer.
dioxus = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"

[dev-dependencies]
http = "1"
tower = { version = "0.5", features = ["util"] }
rustls = { version = "0.23", features = ["ring"] }
tempfile = "3"
