[package]
name = "openkite-web"
description = "Browser shell: axum server, server-rendered console, WebSocket delta stream"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "openkite-web"
path = "src/main.rs"

[dependencies]
axum.workspace = true
dioxus.workspace = true
openkite-ui = { path = "../openkite-ui", version = "0.1.0", features = ["web"] }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
http-body-util.workspace = true
tower.workspace = true
