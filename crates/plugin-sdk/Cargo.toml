[package]
name = "openkite-plugin-sdk"
version = "0.1.0"
edition = "2021"
description = "Plugin SDK for OpenKite — the stable contract between core and plugins."
license = "MIT OR Apache-2.0"

[dependencies]
dioxus = { version = "0.7" }
tokio = { version = "1", features = ["rt"] }
anyhow = "1"

# Library crate: do NOT enable a k8s-openapi version feature here.
# The binary crate (openkite) selects the Kubernetes version via k8s-openapi.
kube = { version = "4", default-features = false, features = ["client", "runtime", "derive", "rustls-tls"] }
