[package]
name = "openkite-plugin-sdk"
version = "0.0.0"
edition = "2021"
publish = false
description = "Plugin SDK for OpenKite — the stable contract between core and plugins."
license = "MIT OR Apache-2.0"

[dependencies]
dioxus = { version = "0.7" }
tokio = { version = "1", features = ["rt"] }
anyhow = "1"

# Deps: no k8s-openapi version feature (binary selects it).
# Dev-deps: select one — standalone --all-targets builds panic otherwise.
kube = { version = "4", default-features = false, features = ["client", "runtime", "derive", "rustls-tls"] }

[dev-dependencies]
http = "1"
rustls = { version = "0.23", features = ["ring"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
k8s-openapi = { version = "0.28", features = ["latest"] }
